[project]
name = "sitekit"
version = "0.1.0"
description = "Data tooling for un1tz3r0.github.io"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "yarl>=1.9",
    "tomlkit>=0.12",
    "anthropic>=2.3",
    # Needs 3.13, and the daily workflow runs on 3.12. Without it pulse just skips the browser-history import.
    'browserprofile @ git+https://github.com/un1tz3r0/browserprofile ; python_version >= "3.13"',
]

[project.scripts]
sitekit = "sitekit.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sitekit"]

[tool.setuptools.package-data]
sitekit = ["extension/*", "icons/*", "pulse.example.toml"]
