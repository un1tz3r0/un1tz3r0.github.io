<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>sitekit pulse</title>
<style>
  :root { color-scheme: light dark; --bg: #fafafa; --card: #fff; --fg: #1f1f1f; --dim: #5f6368; --line: #e3e3e3;
          --active: #2e7d32; --idle: #78909c; --paused: #ef8f00; --offline: #c62828; --shadow: 0 1px 3px rgb(0 0 0 / .12); }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1b1b1d; --card: #242427; --fg: #e8e8e8; --dim: #a0a4a8; --line: #36363a; --shadow: 0 1px 3px rgb(0 0 0 / .5); }
  }
  * { box-sizing: border-box; }
  body { margin: 0; width: 340px; padding: 12px; background: var(--bg); color: var(--fg); font: 13px/1.45 system-ui, sans-serif; }
  section { background: var(--card); border-radius: 10px; box-shadow: var(--shadow); padding: 12px; margin-bottom: 10px; }
  header { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; }
  h1 { font-size: 15px; margin: 0; font-weight: 600; }
  h2 { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); margin: 0 0 8px; font-weight: 600; }
  svg.icon { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .mode { color: var(--idle); } .mode[data-mode=active] { color: var(--active); } .mode[data-mode=paused] { color: var(--paused); }
  .mode[data-mode=offline] { color: var(--offline); }
  .sub { color: var(--dim); font-size: 12px; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin: 0; }
  dt { color: var(--dim); } dd { margin: 0; overflow-wrap: anywhere; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; }
  button { font: inherit; border: 1px solid var(--line); background: transparent; color: var(--fg); border-radius: 16px; padding: 4px 12px;
           cursor: pointer; transition: background .15s; }
  button:hover { background: color-mix(in srgb, var(--fg) 8%, transparent); }
  button:disabled { opacity: .45; cursor: default; }
  .error { color: var(--offline); font-size: 12px; margin-top: 6px; }
  .error:empty { display: none; }
  code { font-size: 11px; background: color-mix(in srgb, var(--fg) 8%, transparent); padding: 1px 4px; border-radius: 4px; }
</style>
</head>
<body>
<svg hidden><symbol id="pulse" viewBox="0 0 24 24"><path d="M2.5 12h4l2.2-5.5 4.3 11 2.3-5.5h6.2"/></symbol></svg>

<template id="plugin-row">
  <style>
    :host { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid var(--line); }
    :host(:first-of-type) { border-top: 0; }
    .name { font-weight: 500; } .off { opacity: .5; }
    .when { color: var(--dim); font-size: 12px; } .err { color: var(--offline); }
    button { font: inherit; border: 1px solid var(--line); background: transparent; color: var(--fg); border-radius: 16px; padding: 2px 10px; cursor: pointer; }
    button:disabled { opacity: .45; cursor: default; }
  </style>
  <div><div class="name"></div><div class="when"></div></div>
  <button hidden>Sync</button>
</template>

<section>
  <header>
    <svg class="icon mode"><use href="#pulse"/></svg>
    <div><h1>sitekit pulse</h1><div class="sub" id="summary"></div></div>
  </header>
  <div class="error" id="error"></div>
</section>

<section>
  <h2>This page</h2>
  <dl id="page"></dl>
</section>

<section>
  <h2>Daemon</h2>
  <div class="row">
    <button data-act="pause" data-minutes="30">Pause 30 min</button>
    <button data-act="pause" data-minutes="0">Pause</button>
    <button data-act="resume">Resume</button>
    <button data-act="publish">Publish now</button>
    <button data-act="reconnect">Reconnect</button>
  </div>
</section>

<section>
  <h2>Plugins</h2>
  <div id="plugins"></div>
</section>

<script type="module" src="popup.js"></script>
</body>
</html>
