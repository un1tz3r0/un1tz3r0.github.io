# sitekit settings for this site. See tools/README.md.

[github]
user = "un1tz3r0"
# Matched against "Name <email>" of every commit; only matching commits count.
author = "un1tz3r0|Victor Condino"
forks = true
# Repos left off the timeline and the feed, by name or owner/name.
ignore = []
# Repos the API listing misses: other people's repos you commit to, or local checkouts (counted, never named in the feed).
repos = ["jfischoff/next-pose-control-net", "appostasy-io/appostasy.io"]

# Feeds `sitekit sync` imports from (the daily workflow runs it). kind: post, status, link, media or lj.
[[feeds]]
url = "https://un1tz3r0.livejournal.com/data/atom"
source = "livejournal"
kind = "lj"

[[feeds]]
url = "https://medium.com/feed/@un1tz3r0"
source = "medium"

# Big files (gallery masters, long videos) live outside the repo. See tools/README.md, "Hosting media".
[media]
base = ""       # public URL of the bucket, e.g. "https://media.example.net/"; empty serves the gallery from this repo only
masters = ""    # local folder of full-size files, e.g. "~/Media/site"; `sitekit gallery add` writes them here
remote = ""     # rclone remote the masters are mirrored to, e.g. "r2:un1tz3r0-media" or "gcs:un1tz3r0-media"
backup = ""     # local folder (your SSD) that `sitekit backup` keeps a dated delta copy of the bucket in
