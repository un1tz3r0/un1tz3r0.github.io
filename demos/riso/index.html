<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Riso separation lab</title>
<script>
{
  const mq = matchMedia('(prefers-color-scheme: dark)'), html = document.documentElement;
  let pinned = null;
  try { pinned = localStorage.getItem('riso-theme'); } catch {}
  const apply = () => { html.dataset.theme = pinned ?? (mq.matches ? 'dark' : 'light'); dispatchEvent(new Event('themechange')); };
  mq.addEventListener('change', apply);
  apply();
  window.toggleTheme = () => {
    const next = html.dataset.theme === 'dark' ? 'light' : 'dark';
    pinned = next === (mq.matches ? 'dark' : 'light') ? null : next;
    try { pinned ? localStorage.setItem('riso-theme', pinned) : localStorage.removeItem('riso-theme'); } catch {}
    apply();
  };
}
</script>
<style>/*<![CDATA[*/
:root {
  color-scheme: light; --canvas: #d6d6d3; --surface: #fbfbfa; --fg: #1f2023;
  --shadow: 0 1px 2px rgb(0 0 0 / .12), 0 6px 20px rgb(0 0 0 / .08);
}
:root[data-theme=dark] {
  color-scheme: dark; --canvas: #161618; --surface: #26272a; --fg: #e6e6e8;
  --shadow: 0 1px 2px rgb(0 0 0 / .5), 0 8px 24px rgb(0 0 0 / .35);
}
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--canvas); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; }
body.busy, body.busy * { cursor: progress !important; }
.inspect-veil { position: fixed; inset: 0; z-index: 7; cursor: help; }
:root {
  --field: color-mix(in srgb, var(--fg) 7%, transparent); --field-h: color-mix(in srgb, var(--fg) 10%, transparent);
  --field-f: color-mix(in srgb, var(--fg) 13%, transparent); --line: color-mix(in srgb, var(--fg) 16%, transparent);
  --button: color-mix(in srgb, var(--fg) 10%, var(--surface)); --button-h: color-mix(in srgb, var(--fg) 16%, var(--surface));
  --row-h: 24px; --radius-s: 6px; --pad-s: 6px;
}
@media (max-width: 640px) { settings-panel { left: 8px; right: 8px; top: 8px; width: auto !important; max-height: 50dvh; } }
/*]]>*/</style>
</head>
<body>
<riso-viewer></riso-viewer>
<settings-panel></settings-panel>
<riso-toolbar></riso-toolbar>
<preset-browser></preset-browser>
<status-line></status-line>
<docs-drawer></docs-drawer>
<help-highlight></help-highlight>

<script type="module">
//<![CDATA[

const KINDS = ['image', 'solid', 'gradient'], GRADS = ['linear', 'radial', 'conic', 'hue wheel'];
const EDGES = ['blank', 'clamp', 'repeat', 'mirror'], RANGES = ['clip', 'wrap', 'mirror'];
const MODES = ['hue', 'key', 'luma', 'unmix'];
const PATTERNS = ['round', 'square', 'diamond', 'cross', 'line', 'bayer', 'blue noise', 'white noise'];
const SIZES = { A6: [105, 148], A5: [148, 210], A4: [210, 297], A3: [297, 420], Letter: [215.9, 279.4], Tabloid: [279.4, 431.8] };
const ANGLES = [15, 75, 0, 45, 30, 60, 90, 105];
const ALL_LAYERS = { stage: 3, solo: -1, gray: false };

const rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255);
const hue = ([r, g, b]) => {
  const M = Math.max(r, g, b), d = M - Math.min(r, g, b);
  if (!d) return 0;
  const h = M === r ? (g - b) / d : M === g ? 2 + (b - r) / d : 4 + (r - g) / d;
  return ((h / 6) % 1 + 1) % 1;
};
const mat3 = m => [m.a, m.b, 0, m.c, m.d, 0, m.e, m.f, 1];
const I3 = mat3(new DOMMatrix());
const pad = (a, z) => [...a, ...Array(8 - a.length).fill(z)];
const rnd = (seed, k) => { const x = Math.sin(seed * 12.9898 + k * 78.233) * 43758.5453; return (x - Math.floor(x)) * 2 - 1; };
const opts = a => Object.fromEntries(a.map(v => [v, v]));
const esc = s => String(s).replace(/[&<>"]/g, c => `&#${c.charCodeAt(0)};`);
const at = (o, path) => path.split('.').reduce((a, k) => a?.[k], o);
const put = (o, path, v) => { const ks = path.split('.'), last = ks.pop(); ks.reduce((a, k) => a[k], o)[last] = v; };
const pick = (o, ref) => Object.fromEntries(Object.keys(ref).filter(k => k in o).map(k => [k, o[k]]));
const canvasBg = () => rgb(getComputedStyle(document.documentElement).getPropertyValue('--canvas').trim());
const workSize = (S, m) => {
  const a = S.page.width / S.page.height;
  return a >= 1 ? [m, Math.max(1, Math.round(m / a))] : [Math.max(1, Math.round(m * a)), m];
};

/* ---------- schema ---------- */

// Declarative UI tree, the single description of every control. Value nodes bind `key`, a dotted path relative to
// the enclosing `scope`. Shared fields: id, label, icon, help (one line for the status line), when(scopeObject, S) → visible,
// get(S)/set(S, v) to bind something other than a plain path, def (default value, used by filter params).
const node = (type, key, label, o = {}) => ({ type, key, label, ...o });
const num = (key, label, min, max, o) => node('num', key, label, { min, max, ...o });
const point = (key, label, min, max, o) => node('point', key, label, { min, max, ...o });
const choice = (key, label, options, o) => node('choice', key, label, { options, ...o });
const toggle = (key, label, o) => node('toggle', key, label, o);
const color = (key, label, o) => node('color', key, label, o);
const ink = (key, label, o) => node('ink', key, label, o);
const action = (id, label, run, o) => node('action', null, label, { id, run, ...o });
const group = (id, label, children, o) => node('group', null, label, { id, children, ...o });
const page = (id, label, icon, children, o) => ({ id, label, icon, children, ...o });
const custom = (id, label, build, o) => node('custom', null, label, { id, build, ...o });
const HELP = new Map();   // id → { label, icon, help }, filled as the UI is built
const rich = text => esc(text).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/::([a-z_]+)::/g, (m, k) => ICONS[k] ? icon(k) : m)
  .replace(/\[\[([\w.]+)\|([^\]]+)\]\]/g, '<a href="#" data-goto="$1">$2</a>');
// Panel and reference derive ids the same way: an explicit id, or the enclosing id plus the key's last segment.
const nodeId = (n, ctx) => n.id ?? join(ctx.id, n.key?.split('.').pop());

/* ---------- filters ---------- */

const CHANNELS = ['luma', 'average', 'max', 'min', 'red', 'green', 'blue'], NOISES = ['gaussian', 'uniform', 'salt & pepper'];
const radius = (def, max, help, min = 0) => num('radius', 'Radius', min, max, { def, unit: 'mm', help });
const softness = (def, max) => num('softness', 'Softness', 0, max, { def, help: 'Width of the grey transition at the cut-off.' });
const morph = (label, help, seq) => ({
  label, cat: 'Morphology', icon: 'morph', help,
  params: [radius(.2, 5, 'Size of the neighbourhood.'),
    choice('shape', 'Shape', ['square', 'disk'], { def: 'square', help: 'Square is fast; disk is round and slower.' })],
  run(f, x, c) {
    const r = c.mm(f.radius), m = (a, max, keep) => f.shape === 'disk'
      ? c.run(c.P.morph, { uR: r, uMax: max, uDisk: 1, uDir: [0, 0] }, a, a, keep)
      : c.sep(c.P.morph, a, { uR: r, uMax: max, uDisk: 0 }, keep);
    return seq(m, x, c);
  },
});
// Each filter: catalog info, params (schema nodes with defaults), and run(f, x, c) → buffer, where `c` is the stack
// context from Renderer.stack. Filters flagged `color` only apply to the RGB source, never to single-channel ink layers.
const FILTERS = {
  brightness: { label: 'Brightness / contrast', cat: 'Tone', icon: 'exposure', help: 'Shift and stretch tones around mid-grey.',
    params: [num('brightness', 'Brightness', -1, 1, { def: 0, help: 'Added to every value.' }),
      num('contrast', 'Contrast', 0, 4, { def: 1, help: 'Stretches values away from mid-grey; below 1 flattens.' })],
    run: (f, x, c) => c.point(x, 0, [f.brightness, f.contrast, 0, 0]) },
  levels: { label: 'Levels', cat: 'Tone', icon: 'tonality', help: 'Remap the input range onto the output range, with a midtone gamma.',
    params: [num('black', 'In black', 0, 1, { def: 0, help: 'Input value that becomes the output black.' }),
      num('white', 'In white', 0, 1, { def: 1, help: 'Input value that becomes the output white.' }),
      num('gamma', 'Gamma', .2, 5, { def: 1, help: 'Above 1 lightens midtones, below 1 darkens them.' }),
      num('outBlack', 'Out black', 0, 1, { def: 0, help: 'Darkest output value.' }),
      num('outWhite', 'Out white', 0, 1, { def: 1, help: 'Lightest output value.' })],
    run: (f, x, c) => c.point(x, 1, [f.black, f.white, f.gamma, f.outBlack], [f.outWhite, 0, 0, 0]) },
  gamma: { label: 'Gamma', cat: 'Tone', icon: 'tonality', help: 'Lighten or darken midtones without moving black and white.',
    params: [num('gamma', 'Gamma', .2, 5, { def: 1, help: 'Above 1 lightens midtones, below 1 darkens them.' })],
    run: (f, x, c) => c.point(x, 2, [f.gamma, 0, 0, 0]) },
  invert: { label: 'Invert', cat: 'Tone', icon: 'invert', help: 'Swap light and dark.', params: [], run: (f, x, c) => c.point(x, 3) },
  posterize: { label: 'Posterize', cat: 'Tone', icon: 'tonality', help: 'Reduce to a few flat tone steps.',
    params: [num('levels', 'Levels', 2, 32, { def: 4, step: 1, help: 'Number of tone steps.' })],
    run: (f, x, c) => c.point(x, 4, [f.levels, 0, 0, 0]) },
  normalize: { label: 'Normalize (auto levels)', cat: 'Tone', icon: 'tonality', help: 'Stretch the darkest and lightest values out to full black and white.',
    params: [num('low', 'Clip low', 0, 20, { def: .5, unit: '%', help: 'Share of the darkest pixels allowed to clip to black.' }),
      num('high', 'Clip high', 0, 20, { def: .5, unit: '%', help: 'Share of the lightest pixels allowed to clip to white.' }),
      toggle('perChannel', 'Per channel', { def: false, color: true, help: 'Stretch red, green and blue separately, which also removes colour casts.' })],
    run(f, x, c) {
      const d = c.probe(x), n = d.length / 4;
      const q = (k, p) => Float32Array.from({ length: n }, (_, i) => k < 3 ? d[i * 4 + k] : .2126 * d[i * 4] + .7152 * d[i * 4 + 1] + .0722 * d[i * 4 + 2])
        .sort()[Math.round(p * (n - 1))];
      const ks = f.perChannel && !c.mono ? [0, 1, 2] : [3, 3, 3];
      return c.point(x, 11, [...ks.map(k => q(k, f.low / 100)), 0], [...ks.map(k => q(k, 1 - f.high / 100)), 0]);
    } },
  range: { label: 'Clip / wrap', cat: 'Tone', icon: 'tonality', help: 'Decide what happens to values pushed outside the 0 to 1 range.',
    params: [choice('mode', 'Mode', RANGES, { def: 'clip', help: 'Clip flattens, wrap repeats from the other end, mirror folds back.' })],
    run: (f, x, c) => c.point(x, 5, [RANGES.indexOf(f.mode), 0, 0, 0]) },
  hue: { label: 'Hue rotate', cat: 'Color', color: true, icon: 'color', help: 'Rotate every colour around the colour wheel.',
    params: [num('degrees', 'Degrees', -180, 180, { def: 0, unit: '°', help: 'How far to rotate the hues.' })],
    run: (f, x, c) => c.point(x, 6, [f.degrees / 360, 0, 0, 0]) },
  saturation: { label: 'Saturation', cat: 'Color', color: true, icon: 'color', help: 'Make colours more vivid or more grey.',
    params: [num('amount', 'Amount', 0, 4, { def: 1, help: '0 is grey, 1 is unchanged, above 1 is more vivid.' })],
    run: (f, x, c) => c.point(x, 7, [f.amount, 0, 0, 0]) },
  grayscale: { label: 'Grayscale / channel', cat: 'Color', color: true, icon: 'extract', help: 'Turn the image grey, or pull out a single channel.',
    params: [choice('channel', 'Channel', CHANNELS, { def: 'luma', help: 'Which brightness measure or colour channel becomes the grey value.' })],
    run: (f, x, c) => c.point(x, 8, [CHANNELS.indexOf(f.channel), 0, 0, 0]) },
  blur: { label: 'Gaussian blur', cat: 'Blur & detail', icon: 'blur', help: 'Soften the image evenly.',
    params: [radius(.5, 10, 'Blur size on the printed page.')],
    run: (f, x, c) => c.blur(x, c.mm(f.radius)) },
  sharpen: { label: 'Unsharp mask', cat: 'Blur & detail', icon: 'sharpen', help: 'Crisp up edges by exaggerating local contrast.',
    params: [radius(.4, 5, 'Size of the detail being sharpened.'), num('amount', 'Amount', 0, 5, { def: 1, help: 'Strength of the effect.' })],
    run: (f, x, c) => c.combine(x, c.blur(x, c.mm(f.radius)), 1, [f.amount, 0, 0, 0]) },
  denoise: { label: 'Denoise (bilateral)', cat: 'Blur & detail', icon: 'denoise', help: 'Smooth out noise while keeping edges sharp.',
    params: [radius(.5, 5, 'How far to look for similar pixels.'),
      num('strength', 'Strength', .01, .5, { def: .1, help: 'Tone difference treated as noise rather than as an edge.' })],
    run: (f, x, c) => c.sep(c.P.bilateral, x, { uSigma: Math.max(c.mm(f.radius), .01), uRange: f.strength }) },
  median: { label: 'Median', cat: 'Blur & detail', icon: 'denoise', help: 'Remove specks and dust while keeping edges.',
    params: [radius(.2, 3, 'Size of the neighbourhood.')],
    run: (f, x, c) => c.run(c.P.median, { uR: c.mm(f.radius) }, x) },
  kuwahara: { label: 'Kuwahara (painterly)', cat: 'Blur & detail', icon: 'brush', help: 'Flatten areas into painterly patches with crisp edges.',
    params: [radius(.4, 4, 'Size of the brush patches.')],
    run: (f, x, c) => c.run(c.P.kuwahara, { uR: c.mm(f.radius) }, x) },
  threshold: { label: 'Threshold', cat: 'Threshold', icon: 'threshold', help: 'Split into pure black and white at a cut-off.',
    params: [num('level', 'Level', 0, 1, { def: .5, help: 'Brightness where black turns to white.' }), softness(.02, .5)],
    run: (f, x, c) => c.point(x, 9, [f.level, f.softness, 0, 0]) },
  adaptive: { label: 'Adaptive threshold', cat: 'Threshold', icon: 'threshold', help: 'Black and white with a local cut-off, so uneven lighting still works.',
    params: [radius(2, 20, 'Size of the neighbourhood used as the local cut-off.', .1),
      num('offset', 'Offset', -.3, .3, { def: .02, help: 'Bias toward white (positive) or black (negative).' }), softness(.02, .3)],
    run: (f, x, c) => c.combine(x, c.blur(x, c.mm(f.radius)), 2, [f.offset, f.softness, 0, 0]) },
  edges: { label: 'Edge detect (Sobel)', cat: 'Edges', icon: 'edges', help: 'Keep only the outlines.',
    params: [radius(.1, 2, 'Sampling distance; larger finds broader edges.'), num('gain', 'Gain', 0, 10, { def: 2, help: 'Strength of the outlines.' }),
      toggle('invert', 'Dark lines', { def: true, help: 'Dark lines on white. Turn off on ink layers, where a higher value means more ink.' })],
    run: (f, x, c) => c.run(c.P.sobel, { uR: c.mm(f.radius), uGain: f.gain, uInv: f.invert }, x) },
  xdog: { label: 'Ink sketch (XDoG)', cat: 'Edges', icon: 'brush', help: 'Stylised ink drawing built from edges and shading.',
    params: [radius(.3, 3, 'Line weight.', .05), num('strength', 'Strength', 0, 100, { def: 20, help: 'How strongly edges are emphasised.' }),
      num('threshold', 'Threshold', 0, 1, { def: .5, help: 'Brightness below which areas turn to ink.' }),
      num('sharpness', 'Sharpness', 1, 200, { def: 40, help: 'How hard the ink edges are.' })],
    run(f, x, c) {
      const r = c.mm(f.radius), b1 = c.blur(x, r);
      return c.combine(b1, c.blur(x, r * 1.6, [b1]), 3, [f.strength, f.threshold, f.sharpness, 0]);
    } },
  noise: { label: 'Add noise', cat: 'Noise', icon: 'noise', help: 'Add grain, fixed to the page so the preview and the print match.',
    params: [num('amount', 'Amount', 0, 1, { def: .15, help: 'Strength of the grain.' }),
      num('grain', 'Grain', .01, 2, { def: .05, unit: 'mm', help: 'Size of each grain.' }),
      choice('kind', 'Type', NOISES, { def: 'gaussian', help: 'Gaussian is soft, uniform is even, salt & pepper is black and white specks.' }),
      toggle('mono', 'Monochrome', { def: true, color: true, help: 'Use the same grain in every colour channel.' }),
      num('seed', 'Seed', 0, 999, { def: 1, step: 1, help: 'Pick a different random pattern.' })],
    run: (f, x, c) => c.point(x, 10, [f.amount, f.grain, f.seed, NOISES.indexOf(f.kind)], [+(f.mono || c.mono), 0, 0, 0]) },
  erode: morph('Erode (min)', 'Take the darkest nearby value: dark areas grow, and on an ink layer the ink shrinks.', (m, x) => m(x, 0)),
  dilate: morph('Dilate (max)', 'Take the lightest nearby value: light areas grow, and on an ink layer the ink spreads.', (m, x) => m(x, 1)),
  open: morph('Open', 'Erode then dilate: removes small light specks.', (m, x) => m(m(x, 0), 1)),
  close: morph('Close', 'Dilate then erode: fills small dark gaps.', (m, x) => m(m(x, 1), 0)),
  smooth: morph('Smooth (open, then close)', 'Removes both light specks and dark gaps.', (m, x) => m(m(m(m(x, 0), 1), 1), 0)),
  gradient: morph('Morphological gradient', 'Outline shapes with the difference between dilate and erode.', (m, x, c) => { const d = m(x, 1); return c.combine(d, m(x, 0, [d]), 4); }),
};
const filterSummary = (f, d = FILTERS[f.type]) => {
  const p = d.params[0], v = p && f[p.key];
  const t = typeof v === 'number' ? `${+v.toFixed(2)}${p.unit ? ` ${p.unit}` : ''}` : typeof v === 'string' ? v : '';
  return f.mix < 1 ? `${t} ${Math.round(f.mix * 100)}%`.trim() : t;
};
const filterMenu = mono => Object.entries(Object.groupBy(Object.entries(FILTERS).filter(([, d]) => !(mono && d.color)), ([, d]) => d.cat))
  .map(([cat, list]) => [cat, list.map(([type, d]) => [type, d.label, d.icon])]);

/* ---------- state ---------- */

let uid = 0;
const makeFilter = type => ({ id: uid++, type, on: true, mix: 1, ...Object.fromEntries(FILTERS[type].params.map(p => [p.key, p.def])) });
const normStack = list => (list ?? []).filter(f => FILTERS[f?.type]).map(f => ({ ...makeFilter(f.type), ...structuredClone(f), id: uid++ }));
const sepDefaults = () => ({ on: true, ink: '#000000', mode: 'key', opacity: .9, opaque: 0, hueShift: 0, hueWidth: 1, filters: [] });
const screenDefaults = i => ({
  pattern: 'round', lpi: 50, grain: 1, angle: ANGLES[i % 8], shift: { x: 0, y: 0 }, stretch: { x: 1, y: 1 }, skew: 0,
  mis: { x: 0, y: 0 }, misRot: 0, misScale: 1, jitter: 0, seed: 1,
});
const makeLayer = (sep, i, screen) => ({
  id: uid++,
  sep: { ...sepDefaults(), ...structuredClone(sep), filters: normStack(sep.filters) },
  screen: { ...screenDefaults(i), ...structuredClone(screen) },
});
const defaults = () => ({
  view: { stage: 3, solo: -1, gray: false },
  render: { preview: 1600, exportRes: 3072 },
  page: { width: 148, height: 210, dpi: 600 },
  paper: { color: '#fbfaf6' },
  source: {
    input: { kind: 'gradient', fit: 'cover', solid: '#808080', grad: 'hue wheel', a: '#000000', b: '#ffffff' },
    transform: { scale: 1, rotate: 0, offset: { x: 0, y: 0 }, flipX: false, flipY: false, edge: 'blank' },
    filters: [],
  },
  layers: ['#ff48b0', '#0078bf', '#ffe800'].map((ink, i) => makeLayer({ ink, mode: 'hue' }, i)),
});
const DEF = defaults();

/* ---------- presets ---------- */

const pathGroup = (label, title, path) => ({
  label, title, get: S => at(S, path),
  apply: (S, v) => put(S, path, { ...structuredClone(at(DEF, path)), ...structuredClone(v) }),
});
const GROUPS = {
  input: pathGroup('Source', 'Source input', 'source.input'),
  transform: pathGroup('Transform', 'Source transform', 'source.transform'),
  filters: { label: 'Filters', title: 'Source filters', get: S => S.source.filters, apply: (S, v) => S.source.filters = normStack(v) },
  inks: {
    label: 'Inks', title: 'Inks & separation, with layer filters (replaces the layer stack)', get: S => S.layers.map(L => L.sep),
    apply: (S, v) => S.layers = v.slice(0, 8).map((sep, i) => makeLayer(sep, i, S.layers[i]?.screen)),
  },
  screens: {
    label: 'Screens', title: 'Halftone & registration (by layer position)', get: S => S.layers.map(L => L.screen),
    apply: (S, v) => S.layers.forEach((L, i) => { if (v[i]) L.screen = { ...screenDefaults(i), ...structuredClone(v[i]) }; }),
  },
  paper: pathGroup('Paper', 'Paper color', 'paper'),
  page: pathGroup('Page', 'Page size & DPI', 'page'),
};
const capture = (S, keys) => Object.fromEntries(keys.map(k => [k, structuredClone(GROUPS[k].get(S))]));
function applyPreset(S, p) {
  for (const k in GROUPS) if (p.data[k]) GROUPS[k].apply(S, p.data[k]);
  if (S.view.solo >= S.layers.length) S.view.solo = -1;
  return S;
}

// Older formats kept tone and blur/sharpen as fixed fields; they become an equivalent filter stack, in the old order.
const legacyFilters = o => [
  o.hue && { type: 'hue', degrees: o.hue },
  (o.saturation ?? 1) !== 1 && { type: 'saturation', amount: o.saturation },
  (o.gamma ?? 1) !== 1 && { type: 'gamma', gamma: o.gamma },
  ((o.contrast ?? 1) !== 1 || (o.brightness ?? 0) !== 0) && { type: 'brightness', brightness: o.brightness ?? 0, contrast: o.contrast ?? 1 },
  o.invert && { type: 'invert' },
  o.filter === 'blur' && { type: 'blur', radius: o.radius },
  o.filter === 'sharpen' && { type: 'sharpen', radius: o.radius, amount: o.amount },
  o.range && o.range !== 'clip' && { type: 'range', mode: o.range },
].filter(Boolean);
const legacySep = L => ({ ...pick(L, sepDefaults()), filters: L.filters ?? legacyFilters(L) });
function migrate(P) {
  const s = P.source ?? {}, Ls = P.layers ?? [];
  const data = { ...(P.data ?? {
    input: pick(s, DEF.source.input), transform: pick(s, DEF.source.transform), filters: legacyFilters(s),
    inks: Ls, screens: Ls.map((L, i) => pick(L, screenDefaults(i))),
    paper: { color: typeof P.paper === 'string' ? P.paper : DEF.paper.color }, page: pick(P.doc ?? {}, DEF.page),
  }) };
  if (data.adjust || data.filter) {
    data.filters = legacyFilters({ ...data.adjust, ...data.filter });
    delete data.adjust; delete data.filter;
  }
  if (data.inks) data.inks = data.inks.map(legacySep);
  return { name: P.name ?? (P.data ? 'Untitled' : 'Imported session'), data };
}

const BUILTINS = [
  { name: 'Fluoro pink, blue and yellow', data: {
    inks: ['#ff48b0', '#0078bf', '#ffe800'].map(ink => ({ ink, mode: 'hue' })),

class PresetStore extends EventTarget {
  static KEY = 'riso-presets';
  constructor(builtins) {
    super();
    this.builtins = builtins.map((p, i) => ({ ...p, id: `example-${i}`, builtin: true }));
    try { this.user = (JSON.parse(localStorage.getItem(PresetStore.KEY)) ?? []).map(p => ({ ...migrate(p), id: p.id })); }
    catch { this.user = []; }
  }
  get all() { return [...this.builtins, ...this.user]; }
  find(id) { return this.all.find(p => p.id === id); }
  #persist() {
    try { localStorage.setItem(PresetStore.KEY, JSON.stringify(this.user)); } catch {}
    this.dispatchEvent(new Event('change'));
  }
  #unique(name, id) {
    const taken = new Set(this.all.filter(p => p.id !== id).map(p => p.name));
    let n = name, k = 2;
    while (taken.has(n)) n = `${name} (${k++})`;
    return n;
  }
  put({ id, name, data }, persist = true) {
    id ??= crypto.randomUUID?.() ?? Math.random().toString(36).slice(2);
    const p = { id, name: this.#unique(name, id), data }, i = this.user.findIndex(u => u.id === id);
    i < 0 ? this.user.push(p) : this.user[i] = p;
    if (persist) this.#persist();
    return p;
  }
  remove(id) { this.user = this.user.filter(p => p.id !== id); this.#persist(); }
  import(text) {
    const J = JSON.parse(text), list = Array.isArray(J) ? J : J.presets ?? [J];
    list.map(migrate).forEach(p => this.put(p, false));
    this.#persist();
    return list.length;
  }
  serialize(list) {
    return new Blob([JSON.stringify({ format: 'riso-lab-presets', version: 3, presets: list.map(({ name, data }) => ({ name, data })) }, null, 1)]);
  }
}

function hueRanges(seps) {
  const hs = seps.flatMap((s, i) => s.mode === 'hue' ? [{ i, h: hue(rgb(s.ink)) }] : []).sort((a, b) => a.h - b.h);
  const n = hs.length, out = {};
  hs.forEach((e, k) => {
    const l = (e.h - hs[(k + n - 1) % n].h + 1) % 1, r = (hs[(k + 1) % n].h - e.h + 1) % 1;
    out[e.i] = { c: e.h, l: l || .5, r: r || .5 };
  });
  return out;
}

function blueNoise(N) {
  const K = new Float32Array(N * N), E = new Float32Array(N * N).map(() => Math.random() * 1e-6), R = new Float32Array(N * N);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const dx = Math.min(x, N - x), dy = Math.min(y, N - y);
    K[y * N + x] = Math.exp(-(dx * dx + dy * dy) / 4.5);
  }
  for (let r = 0; r < N * N; r++) {
    let m = 0;
    for (let i = 1; i < N * N; i++) if (E[i] < E[m]) m = i;
    R[m] = (r + .5) / (N * N); E[m] = Infinity;
    const mx = m % N, my = (m / N) | 0;
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) E[y * N + x] += K[((y - my + N) % N) * N + (x - mx + N) % N];
  }
  return R;
}

/* ---------- GLSL ---------- */

const VS = `#version 300 es
void main() { vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2); gl_Position = vec4(p * 2. - 1., 0, 1); }`;

const HEAD = `#version 300 es
precision highp float; precision highp int; precision highp sampler2D; precision highp sampler2DArray;
out vec4 o;
vec3 rgb2hsv(vec3 c) {
  vec4 K = vec4(0., -1. / 3., 2. / 3., -1.);
  vec4 p = mix(vec4(c.bg, K.wz), vec4(c.gb, K.xy), step(c.b, c.g));
  vec4 q = mix(vec4(p.xyw, c.r), vec4(c.r, p.yzx), step(p.x, c.r));
  float d = q.x - min(q.w, q.y);
  return vec3(abs(q.z + (q.w - q.y) / (6. * d + 1e-10)), d / (q.x + 1e-10), q.x);
}
vec3 hsv2rgb(vec3 c) { vec3 p = abs(fract(c.xxx + vec3(1., 2. / 3., 1. / 3.)) * 6. - 3.); return c.z * mix(vec3(1), clamp(p - 1., 0., 1.), c.y); }
float fold(float v, int m) { return m == 0 ? clamp(v, 0., 1.) : m == 1 ? (v < 0. || v > 1. ? fract(v) : v) : 1. - abs(1. - mod(v, 2.)); }
vec4 fold(vec4 v, int m) { return vec4(fold(v.x, m), fold(v.y, m), fold(v.z, m), fold(v.w, m)); }
`;

const SAMPLE = `
uniform sampler2D uImg; uniform int uKind, uGrad, uEdge; uniform mat3 uXf; uniform vec3 uSolid, uA, uB; uniform vec2 uSize;
vec3 gen(vec2 u) {
  if (uKind == 0) return texture(uImg, u).rgb;
  if (uKind == 1) return uSolid;
  vec2 c = u - .5; float a = atan(c.y, c.x) / 6.2831853 + .5, r = length(c) * 2.;
  if (uGrad == 3) return hsv2rgb(vec3(a, clamp(r, 0., 1.), 1));
  return mix(uA, uB, clamp(uGrad == 0 ? u.x : uGrad == 1 ? r : a, 0., 1.));
}
void main() {
  vec2 u = (uXf * vec3(gl_FragCoord.xy / uSize, 1)).xy;
  vec3 c = vec3(1);
  if (uEdge > 0 || all(equal(clamp(u, 0., 1.), u)))
    c = gen(uEdge == 1 ? clamp(u, 0., 1.) : uEdge == 2 ? fract(u) : uEdge == 3 ? 1. - abs(1. - mod(u, 2.)) : u);
  o = vec4(c, 1);
}`;

const EXTRACT = `
uniform sampler2DArray uSrc; uniform vec2 uSize; uniform int uMode, uN, uI; uniform vec3 uPaper, uAbs[8];
uniform float uInv[8], uHueC, uHueL, uHueR, uChroma;
void main() {
  vec3 c = clamp(texture(uSrc, vec3(gl_FragCoord.xy / uSize, 0)).rgb, 0., 1.);
  float hi = max(c.r, max(c.g, c.b)), lo = min(c.r, min(c.g, c.b)), d = 0.;
  if (uMode == 0) {
    float dh = fract(rgb2hsv(c).x - uHueC + .5) - .5;
    d = clamp(dh < 0. ? 1. + dh / uHueL : 1. - dh / uHueR, 0., 1.) * (hi - lo) / uChroma;
  } else if (uMode == 1) d = 1. - hi;
  else if (uMode == 2) d = 1. - dot(c, vec3(.2126, .7152, .0722));
  else if (uI >= 0) {
    vec3 r = -max(-log(max(c / uPaper, 1e-3)), 0.);
    float x[8] = float[8](0., 0., 0., 0., 0., 0., 0., 0.);
    for (int k = 0; k < 32; k++) for (int i = 0; i < 8; i++) {
      if (i >= uN) break;
      float n = clamp(x[i] - dot(r, uAbs[i]) * uInv[i], 0., 1.);
      r += (n - x[i]) * uAbs[i]; x[i] = n;
    }
    d = x[uI];
  }
  o = vec4(d);
}`;

// Filter passes read inputs A and B, each an (array texture, layer) pair. uMono spreads a single-channel ink density to gray,
// so every filter sees an RGB value and writes .r back for ink layers.
const FHEAD = `
uniform sampler2DArray uA, uB; uniform float uLA, uLB; uniform vec2 uSize, uPage; uniform bool uMono;
vec4 rd(sampler2DArray t, float l, vec2 uv) { vec4 c = texture(t, vec3(uv, l)); return uMono ? vec4(c.rrr, 1) : c; }
vec4 A(vec2 uv) { return rd(uA, uLA, uv); }
vec4 B(vec2 uv) { return rd(uB, uLB, uv); }
float lum(vec3 c) { return dot(c, vec3(.2126, .7152, .0722)); }
vec2 UV() { return gl_FragCoord.xy / uSize; }
`;

const POINT = `
uniform int uOp; uniform vec4 uP, uQ;
vec3 rand3(vec2 cell, float seed) {
  uvec3 v = uvec3(ivec3(ivec2(cell), int(seed))) * 1664525u + 1013904223u;
  v.x += v.y * v.z; v.y += v.z * v.x; v.z += v.x * v.y; v ^= v >> 16u;
  v.x += v.y * v.z; v.y += v.z * v.x; v.z += v.x * v.y;
  return vec3(v) / 4294967295.;
}
void main() {
  vec4 c = A(UV()); vec3 v = c.rgb;
  if (uOp == 0) v = (v - .5) * uP.y + .5 + uP.x;                                                          // brightness / contrast
  else if (uOp == 1) v = mix(vec3(uP.w), vec3(uQ.x), pow(clamp((v - uP.x) / max(uP.y - uP.x, 1e-4), 0., 1.), vec3(1. / uP.z)));  // levels
  else if (uOp == 2) v = pow(max(v, 0.), vec3(1. / uP.x));                                               // gamma
  else if (uOp == 3) v = 1. - v;                                                                         // invert
  else if (uOp == 4) v = floor(clamp(v, 0., .9999) * uP.x) / (uP.x - 1.);                                // posterize
  else if (uOp == 5) { int m = int(uP.x); v = vec3(fold(v.r, m), fold(v.g, m), fold(v.b, m)); }         // clip / wrap / mirror
  else if (uOp == 6) { vec3 h = rgb2hsv(clamp(v, 0., 1.)); v = hsv2rgb(vec3(fract(h.x + uP.x), h.yz)); } // hue rotate
  else if (uOp == 7) v = mix(vec3(lum(v)), v, uP.x);                                                     // saturation
  else if (uOp == 8) {                                                                                   // grayscale / channel
    int k = int(uP.x);
    v = vec3(k == 0 ? lum(v) : k == 1 ? (v.r + v.g + v.b) / 3. : k == 2 ? max(v.r, max(v.g, v.b)) : k == 3 ? min(v.r, min(v.g, v.b)) : v[k - 4]);
  }
  else if (uOp == 9) v = vec3(smoothstep(uP.x - uP.y - 1e-4, uP.x + uP.y + 1e-4, lum(v)));               // threshold
  else if (uOp == 10) {                                                                                  // noise, seeded on page position
    vec2 cell = floor(UV() * uPage / uP.y);
    vec3 r1 = rand3(cell, uP.z), r2 = rand3(cell, uP.z + 7919.);
    if (uQ.x > .5) { r1 = r1.xxx; r2 = r2.xxx; }
    if (uP.w == 2.) v = mix(v, step(.5, r2), step(r1, vec3(uP.x)));
    else v += uP.x * (uP.w == 0. ? .35 * sqrt(-2. * log(max(r1, 1e-7))) * cos(6.2831853 * r2) : r1 * 2. - 1.);
  }
  else if (uOp == 11) v = (v - uP.rgb) / max(uQ.rgb - uP.rgb, 1e-4);                                    // normalize
  o = vec4(v, c.a);
}`;

const COMBINE = `
uniform int uOp; uniform vec4 uP;
void main() {
  vec2 uv = UV(); vec3 a = A(uv).rgb, b = B(uv).rgb, v;
  if (uOp == 0) v = mix(a, b, uP.x);                                                                     // mix / copy
  else if (uOp == 1) v = a + uP.x * (a - b);                                                             // unsharp
  else if (uOp == 2) v = vec3(smoothstep(-uP.y - 1e-4, uP.y + 1e-4, lum(a) - lum(b) + uP.x));            // adaptive threshold
  else if (uOp == 3) {                                                                                   // XDoG
    float d = (1. + uP.x) * lum(a) - uP.x * lum(b);
    v = vec3(d >= uP.y ? 1. : 1. + tanh(uP.z * (d - uP.y)));
  }
  else v = abs(a - b);                                                                                   // difference
  o = vec4(v, 1);
}`;

const BLUR = `
uniform vec2 uDir; uniform float uSigma;
void main() {
  vec2 uv = UV(); vec4 b = A(uv);
  if (uSigma >= .3) {
    float st = max(1., uSigma * 3. / 32.), ws = 1.;
    for (int i = 1; i <= 32; i++) {
      float x = float(i) * st;
      if (x > uSigma * 3. + st) break;
      float w = exp(-.5 * x * x / (uSigma * uSigma)); vec2 d = uDir * x / uSize;
      b += w * (A(uv + d) + A(uv - d)); ws += 2. * w;
    }
    b /= ws;
  }
  o = b;
}`;

const BILATERAL = `
uniform vec2 uDir; uniform float uSigma, uRange;
void main() {
  vec2 uv = UV(); vec4 c = A(uv), acc = c; float ws = 1., st = max(1., uSigma * 2. / 16.);
  for (int i = 1; i <= 16; i++) {
    float x = float(i) * st;
    if (x > uSigma * 2. + st) break;
    for (int s = -1; s <= 1; s += 2) {
      vec4 t = A(uv + uDir * float(s) * x / uSize); vec3 d = t.rgb - c.rgb;
      float w = exp(-.5 * x * x / (uSigma * uSigma) - dot(d, d) / (2. * uRange * uRange));
      acc += w * t; ws += w;
    }
  }
  o = acc / ws;
}`;

// Grayscale-ordered min/max: the darkest or brightest neighbor wins with its whole color, so RGB never fringes.
const MORPH = `
uniform vec2 uDir; uniform float uR; uniform bool uMax, uDisk;
void main() {
  vec2 uv = UV(); vec4 best = A(uv); float bl = lum(best.rgb), sg = uMax ? 1. : -1.;
  if (uDisk) {
    float st = max(1., uR / 8.);
    for (int y = -8; y <= 8; y++) for (int x = -8; x <= 8; x++) {
      vec2 d = vec2(x, y) * st;
      if (dot(d, d) > uR * uR + .5) continue;
      vec4 t = A(uv + d / uSize); float l = lum(t.rgb);
      if (sg * (l - bl) > 0.) { best = t; bl = l; }
    }
  } else {
    float st = max(1., uR / 24.);
    for (int i = -24; i <= 24; i++) {
      float x = float(i) * st;
      if (abs(x) > uR + .5) continue;
      vec4 t = A(uv + uDir * x / uSize); float l = lum(t.rgb);
      if (sg * (l - bl) > 0.) { best = t; bl = l; }
    }
  }
  o = best;
}`;

const MEDIAN = `
uniform float uR;
void main() {
  vec2 uv = UV(); float st = max(1., uR / 2.); vec4 s[25]; float l[25];
  for (int y = 0; y < 5; y++) for (int x = 0; x < 5; x++) {
    int k = y * 5 + x;
    s[k] = A(uv + vec2(x - 2, y - 2) * st / uSize); l[k] = lum(s[k].rgb);
  }
  o = s[12];
  for (int i = 0; i < 25; i++) {
    int lt = 0, le = 0;
    for (int j = 0; j < 25; j++) { lt += int(l[j] < l[i]); le += int(l[j] <= l[i]); }
    if (lt <= 12 && le > 12) { o = s[i]; break; }
  }
}`;

const KUWAHARA = `
uniform float uR;
void main() {
  vec2 uv = UV(); int n = int(clamp(ceil(uR), 1., 6.)); float st = max(1., uR / 6.), bv = 1e9; vec3 best = A(uv).rgb;
  for (int q = 0; q < 4; q++) {
    vec2 sg = vec2((q & 1) == 1 ? 1. : -1., (q & 2) == 2 ? 1. : -1.);
    vec3 s = vec3(0); float a = 0., a2 = 0., c = 0.;
    for (int y = 0; y <= 6; y++) for (int x = 0; x <= 6; x++) {
      if (x > n || y > n) continue;
      vec3 t = A(uv + sg * vec2(x, y) * st / uSize).rgb; float l = lum(t);
      s += t; a += l; a2 += l * l; c += 1.;
    }
    float var = a2 / c - a * a / (c * c);
    if (var < bv) { bv = var; best = s / c; }
  }
  o = vec4(best, 1);
}`;

const SOBEL = `
uniform float uR, uGain; uniform bool uInv;
float L(vec2 uv, float x, float y) { return lum(A(uv + vec2(x, y) * max(uR, 1.) / uSize).rgb); }
void main() {
  vec2 uv = UV();
  float gx = L(uv, 1., -1.) + 2. * L(uv, 1., 0.) + L(uv, 1., 1.) - L(uv, -1., -1.) - 2. * L(uv, -1., 0.) - L(uv, -1., 1.);
  float gy = L(uv, -1., 1.) + 2. * L(uv, 0., 1.) + L(uv, 1., 1.) - L(uv, -1., -1.) - 2. * L(uv, 0., -1.) - L(uv, 1., -1.);
  float m = clamp(length(vec2(gx, gy)) * uGain * .25, 0., 1.);
  o = vec4(vec3(uInv ? 1. - m : m), 1);
}`;

const VIEW = `
uniform sampler2DArray uSrc, uOrig, uRaw, uFilt; uniform sampler2D uBlue; uniform float uSplit;
uniform mat3 uToDoc, uMis[8], uScr[8]; uniform vec2 uDoc, uRes; uniform float uZoom, uCell[8], uOpacity[8], uOpaque[8];
uniform int uN, uStage, uSolo, uPat[8], uOn[8]; uniform bool uGray, uExport, uFlip; uniform vec3 uPaper, uBg, uInk[8];
float roundArea(float r) {
  float a = 3.14159265 * r * r;
  if (r > .5) a -= 4. * (r * r * acos(.5 / r) - .5 * sqrt(r * r - .25));
  return clamp(a, 0., 1.);
}
float spot(int p, vec2 q) {
  vec2 f = abs(fract(q) - .5);
  if (p == 0) return roundArea(length(f));
  if (p == 1) { float m = 2. * max(f.x, f.y); return m * m; }
  if (p == 2) { float t = f.x + f.y; return t < .5 ? 2. * t * t : 1. - 2. * (1. - t) * (1. - t); }
  if (p == 3) { float w = 1. - 2. * min(f.x, f.y); return 1. - w * w; }
  return 2. * f.y;
}
float thresh(int p, vec2 q) {
  ivec2 c = ivec2(floor(q));
  if (p == 5) {
    ivec2 m = c & 7; int z = m.x ^ m.y;
    return (float(((z & 1) << 5) | ((m.x & 1) << 4) | ((z & 2) << 2) | ((m.x & 2) << 1) | ((z & 4) >> 1) | ((m.x & 4) >> 2)) + .5) / 64.;
  }
  if (p == 6) return texelFetch(uBlue, c & 63, 0).r;
  uint h = uint(c.x) * 73856093u ^ uint(c.y) * 19349663u;
  h = (h ^ (h >> 16)) * 0x45d9f3bu; h = (h ^ (h >> 16)) * 0x45d9f3bu;
  return float(h ^ (h >> 16)) / 4294967295.;
}
float cover(int i, vec2 lp, float d) {
  vec2 q = (uScr[i] * vec3(lp, 1)).xy;
  float px = uCell[i] * uZoom, c;
  if (uPat[i] < 5) {
    float s = spot(uPat[i], q);
    c = uExport ? step(s, d) : mix(d, clamp((d - s) / max(fwidth(s), 1e-4) + .5, 0., 1.), smoothstep(1.5, 4., px));
  } else {
    c = step(thresh(uPat[i], q), d);
    if (!uExport) c = mix(d, c, smoothstep(.6, 1.5, px));
  }
  return d < .002 ? 0. : d > .998 ? 1. : c;
}
void main() {
  vec2 s = vec2(gl_FragCoord.x, uFlip ? uRes.y - gl_FragCoord.y : gl_FragCoord.y), p = (uToDoc * vec3(s, 1)).xy;
  vec2 e = max(max(-p, p - uDoc), 0.);
  if (e.x + e.y > 0.) { o = vec4(uBg * (1. - .22 * exp(-length(e) * uZoom / 14.)), 1); return; }
  if (s.x < uSplit) { o = vec4(clamp(texture(uOrig, vec3(p / uDoc, 0)).rgb, 0., 1.), 1); return; }
  if (uStage == 0) { o = vec4(clamp(texture(uSrc, vec3(p / uDoc, 0)).rgb, 0., 1.), 1); return; }
  bool solo = uSolo >= 0, gray = solo && uGray;
  vec3 col = gray ? vec3(1) : uPaper;
  for (int i = 0; i < 8; i++) {
    if (i >= uN) break;
    if (solo ? i != uSolo : uOn[i] == 0) continue;
    vec2 lp = uStage == 1 ? p : (uMis[i] * vec3(p, 1)).xy, lu = lp / uDoc;
    float d = all(equal(clamp(lu, 0., 1.), lu))
      ? clamp((uStage == 1 ? texture(uRaw, vec3(lu, float(i))) : texture(uFilt, vec3(lu, float(i)))).r, 0., 1.) : 0.;
    float c = uStage == 3 ? cover(i, lp, d) : d;
    vec3 ink = gray ? vec3(0) : uInk[i];
    col = mix(col, mix(col * ink, ink, gray ? 0. : uOpaque[i]), c * (gray ? 1. : uOpacity[i]));
  }
  o = vec4(col, 1);
}`;

/* ---------- WebGL ---------- */

const flat = v => [v].flat(3).map(Number);

class Program {
  constructor(gl, fs) {
    const shader = (type, src) => {
      const s = gl.createShader(type);
      gl.shaderSource(s, src); gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
      return s;
    };
    const p = this.p = gl.createProgram();
    this.gl = gl;

const sprite = keys => `<svg hidden>${keys.map(k => `<symbol id="${k}" viewBox="0 -960 960 960"><path d="${ICONS[k]}"/></symbol>`).join('')}</svg>`;
const icon = k => `<svg><use href="#${k}"/></svg>`;
const BASE = new CSSStyleSheet();
BASE.replaceSync(`
  :where([hidden]) { display: none !important; }
  :where(button) { all: unset; box-sizing: border-box; cursor: pointer; }
  :where(button:focus-visible) { outline: 2px solid currentColor; outline-offset: 1px; }
  :where(button:disabled) { opacity: .4; cursor: default; }
  .icon { display: inline-grid; place-items: center; width: var(--icon-box, 32px); height: var(--icon-box, 32px); border-radius: 50%; }
  .icon:hover:not(:disabled) { background: color-mix(in srgb, currentColor 10%, transparent); }
  .icon svg, .txt svg { width: 20px; height: 20px; fill: currentColor; flex: none; }
  .txt { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 8px; font-weight: 500; }
  .txt:hover:not(:disabled) { background: color-mix(in srgb, currentColor 9%, transparent); }
`);
const shadow = (el, html) => {
  const r = el.attachShadow({ mode: 'open' });

};

class ViewToggle extends HTMLElement {
  static #mem = (() => { try { return JSON.parse(localStorage.getItem('riso-views')) ?? {}; } catch { return {}; } })();
  constructor() {
    super();
    shadow(this, `<style>:host { display: inline-block; }</style>${sprite(['grid', 'list'])}<button class="icon"><svg><use/></svg></button>`)
      .querySelector('button').onclick = () => this.value = this.value === 'grid' ? 'list' : 'grid';
    this.#render();
  }
  get value() { return ViewToggle.#mem[this.getAttribute('key')] ?? 'grid'; }
  set value(v) {
    ViewToggle.#mem[this.getAttribute('key')] = v;
    try { localStorage.setItem('riso-views', JSON.stringify(ViewToggle.#mem)); } catch {}
    this.#render();
    this.dispatchEvent(new Event('change'));
  }
  #render() {
    const b = this.shadowRoot.querySelector('button'), next = this.value === 'grid' ? 'list' : 'grid';
    b.title = b.ariaLabel = `Show as ${next}`;
    b.querySelector('use').setAttribute('href', `#${next}`);
  }
}

    const c = this.canvas, S = this.state, dpr = devicePixelRatio;
    const w = Math.max(1, Math.round(c.clientWidth * dpr)), h = Math.max(1, Math.round(c.clientHeight * dpr));
    if (c.width !== w || c.height !== h) Object.assign(c, { width: w, height: h });
    if (this.fitPending) {
      const side = (this.insetRight ?? 0) * dpr, m = 40 * dpr;
      this.zoom = Math.max(1e-3, Math.min((w - side - 2 * m) / S.page.width, (h - 2 * m) / S.page.height));
      this.pan = [(w - side - S.page.width * this.zoom) / 2, (h - S.page.height * this.zoom) / 2];
      this.fitPending = false;
    }
    if (this.needRun || !this.set) { this.set = this.r.run(S, S.render.preview, 'view'); this.needRun = false; }
    this.r.draw(S, this.set, { ...S.view, toDoc: new DOMMatrix().scale(1 / this.zoom).translate(-this.pan[0], -this.pan[1]),
      zoom: this.zoom, res: [w, h], flip: true, bg: canvasBg(), split: this.#split == null ? -1 : this.#split * w });
    const cov = this.set.coverage.join();
    if (cov !== this.cov) { this.cov = cov; this.dispatchEvent(new Event('coverage')); }
    this.dispatchEvent(new Event('view'));
  }
}

// Light-DOM value widgets, styled by the panel that hosts them. Each emits `value` events: { value, last },
// where `last` marks the end of a gesture (slider release, Enter, picker close).
const autoStep = (min, max) => 10 ** Math.floor(Math.log10((max - min) / 100));
const decimals = step => Math.max(0, -Math.floor(Math.log10(step) + 1e-9));
const textInput = (label, extra = '') => `<input class="txt" inputmode="decimal" spellcheck="false" autocomplete="off" aria-label="${esc(label)}" ${extra}>`;

class Field extends HTMLElement {
  static create(n, ...a) { return document.createElement(this.tag).setup(n, ...a); }
  emit(value, last) {
    this.value = value;
    this.dispatchEvent(new CustomEvent('value', { detail: { value, last } }));
  }
  // Typed text is left alone while the user edits it; Enter or blur commits, arrow keys step.
  numeric(t, step, commit, nudge) {
    t.addEventListener('focus', () => t.select());
    t.addEventListener('input', () => this.typing = true);
    t.addEventListener('change', () => { this.typing = false; const v = parseFloat(t.value); isFinite(v) ? commit(v) : this.value = this.value; });
    t.addEventListener('blur', () => { this.typing = false; this.value = this.value; });
    t.addEventListener('keydown', e => {
      if (e.key === 'Enter') return t.blur();
      const d = { ArrowUp: 1, ArrowDown: -1 }[e.key];
      if (!d) return;
      e.preventDefault();
      this.typing = false;
      nudge(d * step * (e.shiftKey ? 10 : 1));
    });
  }
}

class NumField extends Field {
  static tag = 'num-field';
  setup(n) {
    const { min, max, unit = '' } = n, step = n.step ?? autoStep(min, max), dec = decimals(step);
    const snap = v => +(Math.round(v / step) * step).toFixed(dec);
    Object.assign(this, { min, max, fmt: v => v.toFixed(dec) + (unit && ` ${unit}`) });
    this.innerHTML = `<input type="range" min="${min}" max="${max}" step="any" tabindex="-1" aria-hidden="true">${textInput(n.label, 'role="spinbutton"')}`;
    const [r, t] = this.children;
    Object.assign(this, { r, t });
    r.addEventListener('input', () => this.emit(snap(+r.value), false));
    r.addEventListener('change', () => this.emit(snap(+r.value), true));
    this.numeric(t, step, v => this.emit(v, true), d => this.emit(snap(this.v + d), true));
    return this;
  }
  get value() { return this.v; }
  set value(v) {
    this.v = v;
    this.r.value = v;
    this.r.style.setProperty('--p', `${Math.min(Math.max((v - this.min) / (this.max - this.min), 0), 1) * 100}%`);
    this.t.ariaValueNow = v;
    if (!this.typing) this.t.value = this.fmt(v);
  }
}

class PointField extends Field {
  static tag = 'point-field';
  setup(n) {
    const { min, max } = n, step = n.step ?? autoStep(min, max), dec = decimals(step);
    const snap = v => +(Math.round(v / step) * step).toFixed(dec), set = (a, v, last) => this.emit({ ...this.v, [a]: v }, last);
    this.fmt = v => v.toFixed(dec);
    this.innerHTML = ['x', 'y'].map(a => `<label><span title="Drag to adjust">${a}</span>${textInput(`${n.label} ${a}`, `data-a="${a}"`)}</label>`).join('');
    for (const t of this.querySelectorAll('input')) {
      const a = t.dataset.a, s = t.previousElementSibling;
      this.numeric(t, step, v => set(a, v, true), d => set(a, snap(this.v[a] + d), true));
      s.addEventListener('pointerdown', e => {
        s.setPointerCapture(e.pointerId);
        const x0 = e.clientX, v0 = this.v[a];
        s.onpointermove = ev => set(a, Math.min(Math.max(snap(v0 + Math.round((ev.clientX - x0) / 2) * step), min), max), false);
        s.onpointerup = () => { s.onpointermove = null; set(a, this.v[a], true); };
      });
    }
    return this;
  }
  get value() { return this.v; }
  set value(v) {
    this.v = { ...v };
    if (!this.typing) for (const t of this.querySelectorAll('input')) t.value = this.fmt(v[t.dataset.a]);
  }
}

class ChoiceField extends Field {
  static tag = 'choice-field';
  setup(n, options) {
    this.opts = options.map(o => Array.isArray(o) ? o : [o, String(o)]);
    this.innerHTML = `<select aria-label="${esc(n.label)}">${this.opts.map(([, l], i) => `<option value="${i}">${esc(l)}</option>`).join('')}</select>${icon('chevron')}`;
    this.sel = this.firstElementChild;
    this.sel.addEventListener('change', () => this.emit(this.opts[this.sel.value][0], true));
    return this;
  }
  get value() { return this.v; }
  set value(v) { this.v = v; this.sel.value = this.opts.findIndex(([o]) => o === v); }

class ToggleField extends Field {

    this.innerHTML = `<input type="checkbox" role="switch" aria-label="${esc(n.label)}">`;
    this.box = this.firstElementChild;
    this.box.addEventListener('change', () => this.emit(this.box.checked, true));

class ColorField extends Field {
  static tag = 'color-field';
  setup(n) {
    this.innerHTML = `<label><input type="color" aria-label="${esc(n.label)}"></label><input class="txt" spellcheck="false" autocomplete="off" aria-label="${esc(n.label)} hex">`;
    const [sw, t] = this.children, pick = sw.firstElementChild;
    Object.assign(this, { sw, t, pick });
    pick.addEventListener('input', () => this.emit(pick.value, false));
    pick.addEventListener('change', () => this.emit(pick.value, true));
    t.addEventListener('change', () => {

  set value(v) { this.v = v; this.pick.value = v; this.t.value = v; this.sw.style.setProperty('--c', v); }
}

const inkField = () => {
  const el = document.createElement('ink-palette');
  el.addEventListener('change', () => el.dispatchEvent(new CustomEvent('value', { detail: { value: el.value, last: true } })));

}

// Getting-started tour and generated reference. The section nearest the top of the scroll area is "active" and its
// target id is announced, so the app can reveal and highlight the matching control.
// content = { tutorial: [{ title, icon, target, body: [text] }], reference: [{ id, label, icon, help, doc, depth, kind }] }
// Events: open, close, target (detail: id or null), inspect.
class DocsDrawer extends HTMLElement {
  #ref = [];
  #sections = new Map();
  #visible = new Set();
  #active;
  #timer = 0;
  constructor() {
    super();
    const r = shadow(this, `<style>
      :host { position: fixed; z-index: 3; left: 16px; top: max(16px, env(safe-area-inset-top)); bottom: calc(max(16px, env(safe-area-inset-bottom)) + 64px);

      .tabs button { flex: 1; display: flex; justify-content: center; align-items: center; gap: 6px; height: 30px; border-radius: 8px; font-weight: 500; opacity: .7; }
      .tabs button:hover { opacity: 1; }

      .search { display: flex; align-items: center; gap: 6px; margin: 0 12px 8px; padding: 0 10px; height: 32px; border-radius: 8px; background: var(--field); }
      .search input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; color: inherit; font: inherit; }

      .item h4 { font-size: 13px; }
      .param h4 { font-size: 12.5px; font-weight: 500; }
      .param p { font-size: 12.5px; }
      p { margin: 4px 0; }
      p svg { width: 15px; height: 15px; vertical-align: -3px; }

    </style>${sprite(Object.keys(ICONS))}
    <header>${icon('book')}<h2>Help</h2>

    <label class="search">${icon('search')}<input type="search" placeholder="Search the reference" aria-label="Search the reference"></label>
    <div class="body"><article class="tutorial"></article><article class="reference"></article><p class="none" hidden>Nothing matches.</p></div>`);
    const $ = this.$ = Object.fromEntries(['body', 'tutorial', 'reference', 'tabs', 'none', 'inspect'].map(k => [k, r.querySelector(`.${k}`)]));
    $.search = r.querySelector('input');
    r.querySelector('.close').onclick = () => this.close();

  set content({ tutorial, reference }) {
    const { tutorial: T, reference: R } = this.$;

    R.innerHTML = reference.map(e => `<section class="${e.kind}${e.depth ? ' nested' : ''}" style="--d:${e.depth}" data-target="${esc(e.id)}">
      <h4>${e.icon ? icon(e.icon) : ''}${esc(e.label)}</h4>${e.help ? `<p>${rich(e.help)}</p>` : ''}${e.doc ? `<p>${rich(e.doc)}</p>` : ''}</section>`).join('');
    this.#sections = new Map([...R.children].map(s => [s.dataset.target, s]));

  get isOpen() { return this.hasAttribute('open'); }

    this.$.tutorial.hidden = t !== 'tutorial';
    this.$.reference.hidden = t !== 'reference';

    this.#pick();
  }
  set inspecting(on) { this.$.inspect.ariaPressed = String(on); }
  // Open the drawer; with an id, jump to its reference entry (or the nearest entry above it).
  open(id) {
    if (!this.isOpen) { this.setAttribute('open', ''); this.dispatchEvent(new Event('open')); }
    if (id == null) return this.#pick();
    let k = id;
    while (k && !this.#sections.has(k)) k = k.includes('.') ? k.slice(0, k.lastIndexOf('.')) : '';
    const s = this.#sections.get(k);
    if (this.tab !== 'reference') this.tab = 'reference';
    if (this.$.search.value) { this.$.search.value = ''; this.#filter(); }
    if (!s) return;
    s.scrollIntoView({ block: 'start', behavior: 'smooth' });
    s.classList.remove('flash');
    s.offsetWidth;
    s.classList.add('flash');
  }
  close() {
    if (!this.isOpen) return;
    this.removeAttribute('open');
    this.#active = undefined;
    this.dispatchEvent(new Event('close'));
  }
  toggle() { this.isOpen ? this.close() : this.open(); }
  // The topmost visible section in the upper part of the scroll area is the active one.
  #pick() {
    if (!this.isOpen) return;
    const art = this.tab === 'tutorial' ? this.$.tutorial : this.$.reference;
    const top = [...this.#visible].filter(s => s.parentNode === art && !s.hidden)
      .sort((a, b) => a.getBoundingClientRect().top - b.getBoundingClientRect().top)[0];
    const id = top?.dataset.target || null;
    for (const s of this.$.body.querySelectorAll('section.active')) s.classList.remove('active');
    top?.classList.add('active');
    if (id === this.#active) return;
    this.#active = id;
    clearTimeout(this.#timer);
    this.#timer = setTimeout(() => this.dispatchEvent(new CustomEvent('target', { detail: id })), 120);
  }
  // Show matching reference entries plus the headings above them.
  #filter() {
    const words = this.$.search.value.toLowerCase().split(/\s+/).filter(Boolean), secs = [...this.$.reference.children];
    const hit = secs.map(s => words.every(w => s.textContent.toLowerCase().includes(w))), show = [...hit], stack = [];
    secs.forEach((s, i) => {
      const d = this.#ref[i].depth;
      stack.length = d;
      if (hit[i]) stack.forEach(j => show[j] = true);
      stack[d] = i;
    });
    secs.forEach((s, i) => s.hidden = !show[i]);
    this.$.none.hidden = show.some(Boolean);
    this.#pick();
  }
}

      .acts svg { width: 18px; height: 18px; }

    ${sprite(['add', 'import', 'export', 'close', 'edit', 'dup', 'delete'])}

    const $ = this.$ = Object.fromEntries(['main', 'editor', 'items', 'mode', 'export', 'loupe', 'groups', 'recap', 'save', 'hint']

    items.innerHTML = list.map(p => this.#card(p, groups)).join('') || '<p class="empty">No presets yet.</p>';

  }
  #card(p, groups) {
    const chip = ({ key, label, title }) => {
      const v = p.data[key];

    };
    const acts = p.builtin ? ['dup', 'export'] : ['edit', 'dup', 'export', 'delete'];
    return `<article class="card" data-id="${esc(p.id)}">
      <button class="pick" data-act="load" title="Load ${esc(p.name)}"><span class="thumb"><canvas width="1" height="1"></canvas></span></button>
      <div class="meta"><h3>${esc(p.name)}</h3>${p.builtin ? '<span class="badge">Example</span>' : ''}
        <ul class="chips" aria-label="Settings replaced">${groups.map(chip).join('')}</ul></div>
      <div class="acts">${acts.map(a => `<button class="icon" data-act="${a}" title="${PresetBrowser.ACTS[a]}" aria-label="${PresetBrowser.ACTS[a]}">${icon(a)}</button>`).join('')}</div>
    </article>`;

  #act(b) {

        top: `${Math.min(L.y + 24, innerHeight - size - 8)}px`,

const downloads = window.claude ? claude.use('downloads') : Promise.resolve(null);
async function save(filename, data) {
  const d = await downloads;
  if (d) return d.save({ filename, data }).catch(e => e.code !== 'declined' && status.notify(`Could not save ${filename}: ${e.message}`));
  const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(data), download: filename });
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1e4);
}

const CRC = Array.from({ length: 256 }, (_, n) => { for (let k = 0; k < 8; k++) n = n & 1 ? 0xEDB88320 ^ (n >>> 1) : n >>> 1; return n >>> 0; });
function zip(files) {
  const rec = f => {
    const b = new Uint8Array(f.reduce((s, [, n]) => s + n, 0)), v = new DataView(b.buffer);
    f.reduce((o, [x, n]) => (n === 4 ? v.setUint32(o, x, true) : v.setUint16(o, x, true), o + n), 0);
    return b;
  };
  const parts = [], dir = [];
  let off = 0;
  for (const { name, data } of files) {
    const n = new TextEncoder().encode(name);
    let c = ~0;
    for (const b of data) c = CRC[(c ^ b) & 255] ^ (c >>> 8);
    const common = [[0, 2], [0, 2], [0, 2], [0x21, 2], [~c >>> 0, 4], [data.length, 4], [data.length, 4], [n.length, 2], [0, 2]];
    const local = rec([[0x04034b50, 4], [20, 2], ...common]);
    dir.push(rec([[0x02014b50, 4], [20, 2], [20, 2], ...common, [0, 2], [0, 2], [0, 2], [0, 4], [off, 4]]), n);
    parts.push(local, n, data);
    off += local.length + n.length + data.length;
  }
  const size = dir.reduce((s, d) => s + d.length, 0);
  return new Blob([...parts, ...dir, rec([[0x06054b50, 4], [0, 2], [0, 2], [files.length, 2], [files.length, 2], [size, 4], [off, 4], [0, 2]])]);
}

const history = {
  stack: [], i: -1, timer: 0,
  snapshot: () => JSON.stringify({ ...S, view: undefined }),
  commit() {
    clearTimeout(this.timer);
    const s = this.snapshot();
    if (s === this.stack[this.i]) return;
    this.stack.splice(this.i + 1, Infinity, s);
    if (this.stack.length > 200) this.stack.shift();
    this.i = this.stack.length - 1;
    this.update();
  },
  soon() { clearTimeout(this.timer); this.timer = setTimeout(() => this.commit(), 300); },
  go(d) {
    this.commit();
    const j = this.i + d, page = JSON.stringify(S.page);
    if (j < 0 || j >= this.stack.length) return;
    this.i = j;
    Object.assign(S, JSON.parse(this.stack[j]));
    panel.render();
    viewer.invalidate();
    if (JSON.stringify(S.page) !== page) viewer.fit();
    this.update();
  },
  update() { toolbar.state = { undo: this.i > 0, redo: this.i < this.stack.length - 1, compare: viewer.split != null, help: docs.isOpen }; },
};
const structural = () => { panel.render(); viewer.invalidate(); history.commit(); };

// Reference entries in schema order, with the same ids the panel gives its elements.
function referenceEntries() {
  const out = [], add = (id, label, ic, help, depth, kind) => out.push({ id, label, icon: ic, help: help ?? '', doc: DOCS[id] ?? '', depth, kind });
  const walk = (nodes, ctx, depth) => {
    for (const n of nodes) {
      if (n.type === 'tabs') {
        for (const p of n.pages) { add(p.id, p.label, p.icon, p.help, depth, 'chapter'); walk(p.children, { id: p.id }, depth + 1); }
        continue;
      }
      const id = nodeId(n, ctx);
      add(id, n.label, n.icon, n.help, depth, depth ? n.type === 'group' ? 'group' : 'item' : 'chapter');
      if (n.children) walk(n.children, { id }, depth + 1);
      if (n.docChildren) walk(n.docChildren, { id: n.docCtx }, depth + 1);
    }
  };
  walk(SCHEMA(), { id: '' }, 0);
  add('filters', 'Filter reference', 'tune', '', 0, 'chapter');
  for (const [cat, list] of filterMenu(false)) {
    add(`filters.${cat}`, cat, null, '', 1, 'group');
    for (const [type] of list) {
      const d = FILTERS[type];
      add(`filter.${type}`, `${d.label}${d.color ? ' (source only)' : ''}`, d.icon, d.help, 2, 'item');
      for (const p of d.params) add(`filter.${type}.${p.key}`, p.label, p.icon, p.help, 3, 'param');
    }
  }
  add('tools', 'Toolbar, page and panel', 'settings', '', 0, 'chapter');
  for (const id of ['viewer', 'viewer.split', ...TOOLS.map(([a]) => `tool.${a}`), 'panel.resize', 'panel.collapse', 'docs.inspect']) {
    const e = HELP.get(id);
    add(id, e.label, e.icon, e.help, 1, 'item');
  }
  return out;
}

// Elements anywhere in the page, including inside open shadow roots.
const deepAll = (sel, root = document, out = []) => {
  for (const el of root.querySelectorAll('*')) {
    if (el.matches(sel)) out.push(el);
    if (el.shadowRoot) deepAll(sel, el.shadowRoot, out);
  }

};
// Controls inside popovers (menus, palettes) or hidden by a visibility rule can't be revealed without changing settings.
const unreachable = el => {
  for (let n = el; n && n !== document; n = n.parentNode ?? n.host)
    if (n.hasAttribute?.('popover') || (n.hidden && !n.classList.contains('page'))) return true;
  return false;
};
// The element for a help id, or for the nearest id above it; filter entries fall back to the source filter list.
const FALLBACK = { filter: 'source.filters.list', filters: 'source.filters.list' };
function findTarget(id) {
  const ids = [];
  for (let k = id; k; k = k.slice(0, Math.max(0, k.lastIndexOf('.')))) ids.push(k);
  if (FALLBACK[ids.at(-1)]) ids.push(FALLBACK[ids.at(-1)]);
  for (const k of ids) {
    const el = deepAll(`[data-help="${CSS.escape(k)}"]`).find(e => !unreachable(e));

  const el = id && findTarget(id);

  highlight.show(el, HELP.get(el.dataset.help)?.label);

// Inspect: a transparent veil takes the next click, so no control is operated, and reports what is underneath it.

let docsSnapshot = null;
docs.addEventListener('open', () => { docsSnapshot = panel.snapshot(); history.update(); });

function matchAspect() {
  const sz = viewer.r?.imgSize;
  if (sz) S.page.height = +(S.page.width * sz[1] / sz[0]).toFixed(1);
  viewer.fit();
  structural();
}

async function loadImage(file) {
  if (!file?.type.startsWith('image/') || !viewer.r) return;
  let bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
  const k = Math.min(1, viewer.r.maxTex / Math.max(bmp.width, bmp.height));
  if (k < 1) bmp = await createImageBitmap(bmp, { resizeWidth: Math.floor(bmp.width * k), resizeHeight: Math.floor(bmp.height * k), resizeQuality: 'high' });
  viewer.r.setImage(bmp);
  S.source.input.kind = 'image';
  matchAspect();
}

// Thumbnails and the loupe share the 'thumb' texture set; `prepared` remembers which preset it currently holds.

  capture: keys => capture(S, keys),
  reset: () => prepared = null,
  pick: pick_,
  download: save,
  notify: text => status.notify(text),
  load(p) {

    status.notify(`Loaded “${p.name}”`, 'Undo', () => history.go(-1));

const busy = fn => async () => {
  document.body.classList.add('busy');
  await new Promise(r => setTimeout(r, 30));
  try { await fn(viewer.r.run(S, S.render.exportRes, 'export')); }
  catch (e) { status.notify(`Export failed: ${e.message}`); }

const png = (set, view) => new Promise(res => {
  const z = S.page.dpi / 25.4, W = Math.round(S.page.width * z), H = Math.round(S.page.height * z);
  viewer.r.renderCanvas(S, set, view, { zoom: z, W, H, exp: true }).toBlob(res, 'image/png');

const layerFiles = async (set, stage) => {

    out.push({ name: `${String(i + 1).padStart(2, '0')}-${(inkName(s.ink) ?? s.ink.slice(1)).toLowerCase().replace(/\W+/g, '-')}.png`,
      data: new Uint8Array(await (await png(set, { stage, solo: i, gray: true })).arrayBuffer()) });

const actions = {

  fit: () => viewer.fit(),
  one: () => viewer.zoomAt(S.page.dpi / 25.4),
  compare: () => { viewer.split = viewer.split == null ? .5 : null; history.update(); },
  undo: () => history.go(-1),
  redo: () => history.go(1),
  theme: () => toggleTheme(),
  presets: () => viewer.r && browser.open(),

// Keep the viewer's fit area clear of the panel, and dock the status line between the toolbar and the panel.
const layoutChrome = () => {
  const p = panel.getBoundingClientRect(), t = toolbar.shadowRoot.querySelector('.bar').getBoundingClientRect(), docked = innerWidth > 640;
  const l = t.right + 12, r = docked ? innerWidth - p.left + 12 : 16, roomy = innerWidth - l - r > 280;
  viewer.insetRight = docked ? innerWidth - p.left + 16 : 0;

toolbar.addEventListener('action', e => actions[e.detail]?.());

addEventListener('resize', layoutChrome);
