<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overlay Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root {
  color-scheme: light;
  --bg: #eef0f3; --surface: #ffffff; --surface-2: #f6f7f9; --surface-3: #eaecf0; --line: #dde1e7;
  --text: #1c1f24; --text-2: #656b76; --accent: #3b6ef5;
  --shadow-1: 0 1px 2px rgb(16 24 40 / .06), 0 1px 3px rgb(16 24 40 / .08);
  --shadow-2: 0 6px 16px rgb(16 24 40 / .10), 0 2px 4px rgb(16 24 40 / .06);
  --shadow-3: 0 24px 48px rgb(16 24 40 / .20);
  --c-video: #4f8cff; --c-image: #22a699; --c-bubble: #e9a23b; --c-avatar: #a77bf3; --c-background: #4fb466; --c-action: #e0608b; --c-audio: #36a9c1;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #111215; --surface: #1a1c20; --surface-2: #212328; --surface-3: #2a2d33; --line: #32353c;
    --text: #e6e8ec; --text-2: #9a9fa9; --accent: #7aa2ff;
    --shadow-1: 0 1px 2px rgb(0 0 0 / .35), 0 1px 3px rgb(0 0 0 / .25);
    --shadow-2: 0 6px 16px rgb(0 0 0 / .40), 0 2px 4px rgb(0 0 0 / .30);
    --shadow-3: 0 24px 48px rgb(0 0 0 / .55);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #111215; --surface: #1a1c20; --surface-2: #212328; --surface-3: #2a2d33; --line: #32353c;
  --text: #e6e8ec; --text-2: #9a9fa9; --accent: #7aa2ff;
  --shadow-1: 0 1px 2px rgb(0 0 0 / .35), 0 1px 3px rgb(0 0 0 / .25);
  --shadow-2: 0 6px 16px rgb(0 0 0 / .40), 0 2px 4px rgb(0 0 0 / .30);
  --shadow-3: 0 24px 48px rgb(0 0 0 / .55);
}
body {
  margin: 0; height: 100dvh; display: grid; grid-template-rows: 52px minmax(0, 1fr); overflow: hidden;
  background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
.toolbar { display: flex; align-items: center; gap: 2px; padding: 0 12px; background: var(--surface); box-shadow: var(--shadow-1); z-index: 2; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 650; font-size: 14px; margin-right: 14px; }
.sep { width: 1px; height: 22px; background: var(--line); margin: 0 8px; }
.spacer { flex: 1; }
main {
  display: grid; min-height: 0; padding: 10px; gap: 0 10px;
  grid-template-columns: 250px minmax(0, 1fr) 310px;
  grid-template-rows: minmax(0, 1fr) 10px var(--tl-h, 290px);
}
vt-assets { grid-area: 1 / 1; } vt-viewport { grid-area: 1 / 2; } vt-props { grid-area: 1 / 3; }
.splitter { grid-area: 2 / 1 / 3 / 4; cursor: row-resize; }
vt-timeline { grid-area: 3 / 1 / 4 / 4; }
.panel { background: var(--surface); border-radius: 12px; box-shadow: var(--shadow-1); overflow: hidden; min-height: 0; min-width: 0; }
#add-btn { anchor-name: --add; } #save-btn { anchor-name: --save; }
@supports (anchor-name: --a) {
  #add-menu, #save-menu { inset: auto; top: anchor(bottom); left: anchor(left); margin-top: 6px; }
  #add-menu { position-anchor: --add; } #save-menu { position-anchor: --save; }
}
#save-menu small { margin-left: auto; padding-left: 16px; color: var(--text-2); font-size: 11px; }
#toast { inset: auto 16px 16px auto; margin: 0; border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; background: var(--surface); color: var(--text); box-shadow: var(--shadow-2); max-width: 420px; }
@media (max-width: 900px) {
  body { overflow: auto; height: auto; }
  main { grid-template-columns: minmax(0, 1fr); grid-template-rows: 50vh auto auto 10px 320px; }
  vt-viewport { grid-area: 1 / 1; } vt-props { grid-area: 2 / 1; margin-top: 10px; max-height: 60vh; } vt-assets { grid-area: 3 / 1; margin-top: 10px; max-height: 50vh; }
  .splitter { grid-area: 4 / 1; } vt-timeline { grid-area: 5 / 1; }
  .brand span { display: none; }
}
</style>
<style id="base">
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
.icon { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
button, input, select, textarea { font: inherit; color: inherit; }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; transition: background .15s, box-shadow .15s; white-space: nowrap; }
.btn:hover { background: var(--surface-2); box-shadow: var(--shadow-1); }
.btn.primary { background: var(--accent); border-color: transparent; color: #fff; }
.btn.primary:hover { box-shadow: var(--shadow-2); }
.btn:disabled { opacity: .5; cursor: default; }
.icon-btn { width: 32px; height: 32px; display: inline-grid; place-items: center; border: 0; border-radius: 8px; background: transparent; color: var(--text-2); cursor: pointer; flex: none; }
.icon-btn:hover { background: var(--surface-3); color: var(--text); }
.icon-btn[aria-pressed="true"] { color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
input, select, textarea { background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; min-width: 0; }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
input[type="range"] { accent-color: var(--accent); padding: 0; border: 0; background: transparent; }
input[type="checkbox"] { accent-color: var(--accent); width: 16px; height: 16px; }
input[type="color"] { padding: 2px; height: 28px; width: 48px; cursor: pointer; }
textarea { resize: vertical; min-height: 68px; width: 100%; }
.menu { margin: 0; padding: 6px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--text); box-shadow: var(--shadow-2); min-width: 210px; }
.menu button { display: flex; width: 100%; align-items: center; gap: 10px; padding: 7px 10px; border: 0; border-radius: 6px; background: transparent; cursor: pointer; text-align: left; }
.menu button:hover { background: var(--surface-3); }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
.menu h4 { margin: 8px 10px 4px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--text-2); }
* { scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
</style>

{ "imports": {

<template id="tpl-vt-field">
<style>
:host { display: grid; grid-template-columns: 96px minmax(0, 1fr) 26px; align-items: center; gap: 4px 8px; min-height: 30px; }
:host([wide]) { grid-template-columns: minmax(0, 1fr) 26px; }
:host([wide]) label { grid-column: 1 / -1; }
label { color: var(--text-2); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ctl { display: flex; gap: 6px; align-items: center; min-width: 0; }
.ctl > :only-child { flex: 1; }
.ctl input[type="range"] { flex: 1; }
.ctl input[type="number"] { width: 68px; flex: none; }
.ctl input[type="color"], .ctl input[type="checkbox"] { flex: none; }
.key { width: 26px; height: 26px; }
.key .icon { width: 14px; height: 14px; }
.key[data-state="none"] { opacity: .45; }
.key[data-state="has"] { color: var(--accent); }
.key[data-state="on"] { color: var(--accent); }
.key[data-state="on"] .icon { fill: currentColor; }
.ease { grid-column: 2 / 3; font-size: 12px; }
</style>
<label></label><div class="ctl"></div>
<button class="icon-btn key" hidden title="Add or remove a keyframe at the playhead"><svg class="icon"><use href="#i-diamond"/></svg></button>
<select class="ease" hidden title="Easing from this keyframe to the next"></select>
</template>

<template id="tpl-vt-props">
<style>
:host { display: grid; grid-template-rows: auto minmax(0, 1fr); }
header { display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 14px; border-bottom: 1px solid var(--line); min-height: 50px; }
.titles { flex: 1; min-width: 0; }
.title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sub { color: var(--text-2); font-size: 12px; }
.body { overflow: auto; padding: 0 14px 16px; }
details { border-bottom: 1px solid var(--line); padding-bottom: 10px; }
summary { cursor: pointer; padding: 12px 0 8px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-2); list-style: none; display: flex; justify-content: space-between; }
summary::after { content: "–"; }
details:not([open]) summary::after { content: "+"; }
.fields { display: grid; gap: 4px; }
.note { color: var(--text-2); font-size: 12px; margin: 14px 0 0; }
[hidden] { display: none !important; }
</style>
<header>
  <svg class="icon type"><use href="#i-sliders"/></svg>
  <div class="titles"><div class="title"></div><div class="sub"></div></div>
  <button class="icon-btn dup" title="Duplicate (Ctrl+D)"><svg class="icon"><use href="#i-copy"/></svg></button>
  <button class="icon-btn del" title="Delete (Del)"><svg class="icon"><use href="#i-trash"/></svg></button>
</header>
<div class="body"></div>
</template>

<template id="tpl-vt-assets">
<style>
:host { display: grid; grid-template-rows: auto minmax(0, 1fr); }
:host(.dragover) { outline: 2px dashed var(--accent); outline-offset: -4px; }
header { display: flex; gap: 6px; padding: 9px 10px; border-bottom: 1px solid var(--line); }
header .btn { flex: 1; justify-content: center; }
.list { overflow: auto; padding: 4px 10px 14px; }
h3 { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--text-2); margin: 12px 0 8px; }
.items { display: grid; grid-template-columns: repeat(auto-fill, minmax(98px, 1fr)); gap: 8px; }
.item { position: relative; display: grid; gap: 3px; padding: 6px; border-radius: 9px; background: var(--surface-2); border: 1px solid var(--line); cursor: grab; user-select: none; transition: box-shadow .15s; }
.item:hover { box-shadow: var(--shadow-2); }
.thumb { aspect-ratio: 16 / 9; border-radius: 6px; background: var(--surface-3) center / cover no-repeat; display: grid; place-items: center; color: var(--text-2); }
.thumb .icon { width: 22px; height: 22px; }
.name { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.meta { font-size: 11px; color: var(--text-2); }
.rm { position: absolute; top: 2px; right: 2px; width: 24px; height: 24px; opacity: 0; background: var(--surface); box-shadow: var(--shadow-1); }
.item:hover .rm { opacity: 1; }
.rm .icon { width: 14px; height: 14px; }
.badge { position: absolute; top: 10px; left: 10px; padding: 1px 7px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--text-2); font-size: 10px; cursor: pointer; box-shadow: var(--shadow-1); }
.badge:hover { color: var(--text); }
.item.missing { cursor: pointer; border-style: dashed; }
.item.missing .meta { color: var(--text); }
.empty { color: var(--text-2); font-size: 12px; margin: 0; padding: 14px; border: 1px dashed var(--line); border-radius: 9px; text-align: center; }
.plugin-pop { width: 320px; }
.plugin-pop form { display: grid; gap: 8px; padding: 6px; }
.plugin-pop .row { display: flex; gap: 6px; }
.plugin-pop input { flex: 1; }
.plugin-pop p { margin: 0; font-size: 12px; color: var(--text-2); }
.plugin-btn { anchor-name: --plugin; }
@supports (anchor-name: --a) { .plugin-pop { position-anchor: --plugin; inset: auto; top: anchor(bottom); left: anchor(left); margin-top: 6px; } }
</style>
<header>
  <button class="btn import" title="Import video, images or plugin modules"><svg class="icon"><use href="#i-import"/></svg>Import</button>
  <button class="btn plugin-btn" popovertarget="plugin-pop"><svg class="icon"><use href="#i-plug"/></svg>Plugin</button>
</header>
<div class="list">
  <h3>Media</h3><div class="items media"></div><p class="empty">Drop video, audio or image files here</p>
  <h3>Avatars</h3><div class="items avatar"></div>
  <h3>Avatar actions</h3><div class="items action"></div>
  <h3>Backgrounds</h3><div class="items background"></div>
  <h3>Overlays</h3><div class="items overlay"></div>
</div>
<div id="plugin-pop" class="menu plugin-pop" popover>
  <form>
    <p>Load an ES module whose default export is an avatar or background plugin.</p>
    <div class="row"><input name="url" type="url" placeholder="https://…/plugin.js" required><button class="btn primary">Load</button></div>
    <button type="button" class="btn from-file"><svg class="icon"><use href="#i-import"/></svg>From file…</button>
  </form>
</div>
</template>

<template id="tpl-vt-viewport">
<style>
:host { display: grid; grid-template-rows: minmax(0, 1fr) auto; }
.stage { container-type: size; display: grid; place-items: center; min-height: 0; background: var(--surface-2); }
.frame { position: relative; width: min(100cqw - 32px, (100cqh - 32px) * var(--ar, 1.7778)); aspect-ratio: var(--ar, 1.7778); box-shadow: var(--shadow-2); touch-action: none; }
canvas { display: block; width: 100%; height: 100%; }
svg.overlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.sel { fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 6 4; vector-effect: non-scaling-stroke; }
.transport { display: flex; align-items: center; justify-content: center; gap: 2px; padding: 6px; border-top: 1px solid var(--line); }
.time { font: 12px ui-monospace, "SF Mono", Menlo, monospace; color: var(--text-2); min-width: 150px; text-align: center; }
.play .icon { width: 20px; height: 20px; }
</style>
<div class="stage"><div class="frame"><svg class="overlay" preserveAspectRatio="none"><polygon class="sel"/></svg></div></div>
<div class="transport">
  <button class="icon-btn" data-go="start" title="Go to start (Home)"><svg class="icon"><use href="#i-start"/></svg></button>
  <button class="icon-btn" data-go="prev" title="Previous frame (←)"><svg class="icon"><use href="#i-prev"/></svg></button>
  <button class="icon-btn play" data-go="play" title="Play / pause (Space)"><svg class="icon"><use href="#i-play"/></svg></button>
  <button class="icon-btn" data-go="next" title="Next frame (→)"><svg class="icon"><use href="#i-next"/></svg></button>
  <button class="icon-btn" data-go="end" title="Go to end (End)"><svg class="icon"><use href="#i-end"/></svg></button>

async function addMedia(asset, blob) {

    const img = new Image();
    img.src = url;
    await img.decode();

  } else if (asset.kind === 'audio') {
    const a = Object.assign(document.createElement('audio'), { preload: 'metadata', src: url });
    await once(a, 'loadedmetadata');

    const buf = await decodeBlob(blob);
    if (buf) m.thumb = waveform(buf);
  } else {
    const v = Object.assign(document.createElement('video'), { muted: true, preload: 'auto', src: url });
    await once(v, 'loadeddata');
    Object.assign(m, { width: v.videoWidth, height: v.videoHeight, duration: v.duration });
    v.currentTime = Math.min(1, v.duration / 3);
    await once(v, 'seeked');
    await new Promise(ok => { v.requestVideoFrameCallback?.(ok); setTimeout(ok, 400); });
    const c = h('canvas', { width: 192, height: Math.round(192 * v.videoHeight / v.videoWidth) });

  return m;
}

const PICKER_TYPES = [{ description: 'Media and plugins', accept: {
  'video/*': ['.mp4', '.webm', '.mov', '.mkv', '.m4v'], 'audio/*': ['.mp3', '.wav', '.ogg', '.oga', '.m4a', '.aac', '.flac', '.opus'],
  'image/*': ['.png', '.jpg', '.jpeg', '.gif', '.webp', '.avif', '.svg'], 'text/javascript': ['.js', '.mjs'],
} }];

  if (window.showOpenFilePicker) return showOpenFilePicker({ multiple, types: PICKER_TYPES })
    .then(hs => Promise.all(hs.map(async handle => ({ file: await handle.getFile(), handle }))), e => { if (e.name === 'AbortError') return []; throw e; });
  return new Promise(ok => {
    const input = h('input', { type: 'file', multiple, accept: 'video/*,audio/*,image/*,.js,.mjs',
      onchange: () => ok([...input.files].map(file => ({ file }))), oncancel: () => ok([]) });
    input.click();
  });
}
function dropEntries(dt) {
  const pending = [...dt.items].filter(i => i.kind === 'file').map(i => [i.getAsFile(), i.getAsFileSystemHandle?.().catch(() => null)]);
  return Promise.all(pending.map(async ([file, hp]) => { const handle = await hp; return { file, handle: handle?.kind === 'file' ? handle : null }; }));
}
async function importFiles(entries) {
  for (const { file, handle } of entries) {
    try {
      if (/\.m?js$/i.test(file.name)) { await loadPluginSource(await file.text()); continue; }
      const kind = ['video', 'audio', 'image'].find(k => file.type.startsWith(`${k}/`));
      if (!kind) { toast(`Skipped ${file.name}: not a video, audio, image or plugin file`); continue; }
      const asset = { id: uid(), name: file.name, kind, mime: file.type, lastModified: file.lastModified, linked: !!handle };
      await addMedia(asset, file);
      if (handle) await rememberHandle(asset.id, handle);
      store.project.assets.push(asset);
    } catch (e) { toast(`Could not import ${file.name}: ${e.message}`); }
  }
  store.commit();
}
async function restoreLinked(asset) {
  const handle = await findHandle(asset.id);
  if (!handle) return false;
  linkedHandles.set(asset.id, handle);
  try {
    if (await handle.queryPermission({ mode: 'read' }) !== 'granted' && await handle.requestPermission({ mode: 'read' }) !== 'granted') return false;
    await addMedia(asset, await handle.getFile());
    return true;
  } catch { return false; }
}
async function relink(asset) {
  try {
    if (await restoreLinked(asset)) return store.touch();
    const [picked] = await pickFiles(false);
    if (!picked) return;
    await addMedia(asset, picked.file);
    if (picked.handle) await rememberHandle(asset.id, picked.handle);
    asset.linked = asset.linked && !!picked.handle;
    store.commit();
  } catch (e) { toast(`Could not relink ${asset.name}: ${e.message}`); }
}
async function toggleLinked(asset) {
  const m = media.get(asset.id);
  if (asset.linked) {
    if (m) m.blob = new Blob([await m.blob.arrayBuffer()], { type: m.blob.type });
    asset.linked = false;
  }
  else if (await findHandle(asset.id)) asset.linked = true;
  else return toast(`${asset.name} has no file on disk to link to. Import it with Import or drag-and-drop in Chrome or Edge to link it.`);
  store.commit();
}

const plugins = new Map();
function registerPlugin(def, source = null) {

    throw new Error('A plugin needs an id, kind ("avatar" or "background") and create()');

}
const loadPluginUrl = async href => loadPluginSource(await (await fetch(href)).text());

const LAYERS = { video: VideoLayer, audio: AudioLayer, image: ImageLayer, bubble: BubbleLayer, avatar: SceneLayer, background: SceneLayer };

    store.addEventListener('change', () => { this.sync(); this.requestRender(); });
    store.addEventListener('time', () => this.requestRender());
    store.addEventListener('plugins', () => { this.sync(true); this.requestRender(); });
  }
  resize(W, H) {
    Object.assign(this, { W, H });

    Object.assign(this.camera, { right: W, top: H });

    this.rt?.dispose();
    this.rt = new THREE.WebGLRenderTarget(W, H, { samples: 4, type: THREE.HalfFloatType });

      if (!LAYERS[clip.type]) continue;
      const sig = `${clip.type}|${clip.plugin}|${media.get(clip.props.asset)?.url}`;
      let layer = this.layers.get(clip.id);
      if (layer && (layer.sig !== sig || (rebuildPlugins && clip.plugin))) { layer.dispose(); layer = null; }
      if (!layer) {
        layer = new LAYERS[clip.type](this, clip);
        layer.sig = sig;

  }
  render(t) {
    const { tracks, settings } = store.project, active = [], talking = new Map(), actions = new Map();
    tracks.forEach((track, i) => track.clips.forEach(clip => {
      const on = !track.hidden && t >= clip.start && t < clip.start + clip.duration, lt = t - clip.start;
      if (clip.type === 'action') {
        if (on && clip.props.target && clip.props.action) {
          if (!actions.has(clip.props.target)) actions.set(clip.props.target, []);
          actions.get(clip.props.target).push({ name: clip.props.action, t: lt, u: lt / clip.duration, duration: clip.duration,
            weight: transitionMods(clip, lt).opacity, params: evalAll(clip, lt) });

      const layer = this.layers.get(clip.id);
      if (!layer) return;
      layer.active = layer.mesh.visible = !track.hidden && t >= clip.start && t < clip.start + clip.duration;
      if (!layer.active) return layer.idle?.();

      active.push({ clip, layer, lt: t - clip.start });

    for (const { clip, lt } of active) if (clip.type === 'bubble' && clip.props.avatar)
      talking.set(clip.props.avatar, Math.max(talking.get(clip.props.avatar) ?? 0, transitionMods(clip, lt).vis));
    active.sort((a, b) => (a.clip.type === 'bubble') - (b.clip.type === 'bubble'));
    const ctx = { t, talking, actions, exporting: this.exporting };
    for (const { clip, layer, lt } of active) layer.update(lt, clip, ctx);
    this.renderer.setRenderTarget(this.rt);
    this.renderer.setClearColor(settings.background, 1);
    this.renderer.render(this.scene, this.camera);
    this.renderer.setRenderTarget(null);
    this.renderer.render(this.blitScene, this.camera);

}

const frameRound = t => Math.round(t * store.project.settings.fps) / store.project.settings.fps;
function play() {
  if (store.playing) return;
  const { duration } = store.project.settings;
  if (store.time >= duration - 1e-3) store.seek(0);
  store.playing = true;
  store.emit('play');
  const t0 = performance.now(), s0 = store.time;
  const tick = now => {
    if (!store.playing) return;
    const t = s0 + (now - t0) / 1000;
    if (t >= duration) { store.seek(duration); return pause(); }
    store.seek(t);
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}
function pause() {
  store.playing = false;
  store.seek(frameRound(store.time));
  store.emit('play');
}
const togglePlay = () => store.playing ? pause() : play();
const step = dt => { pause(); store.seek(frameRound(store.time + dt)); };

function clipFromItem(item, t) {
  if (item.kind === 'bubble') return newClip('bubble');
  if (item.kind === 'action') {
    const avatars = [...store.clips()].map(([, c]) => c).filter(c => c.type === 'avatar' && c.plugin === item.plugin);
    const target = avatars.find(c => c.start <= t && t < c.start + c.duration) ?? avatars[0];
    return newAction(item.plugin, item.action, target?.id ?? '');
  }
  if (item.kind === 'plugin') {
    const p = plugins.get(item.id);
    return newClip(p.kind, { plugin: p.id, duration: p.kind === 'background' ? store.project.settings.duration : 5 });
  }
  const a = store.project.assets.find(a => a.id === item.id);
  return newClip(a.kind, { asset: a.id, name: a.name, duration: a.duration || 5 });
}
function addClip(item, { track, t = store.time } = {}) {
  const clip = clipFromItem(item, t);
  clip.start = frameRound(t);
  if (clip.type === 'bubble') {
    const speaker = [...store.clips()].find(([, c]) => c.type === 'avatar' && c.start <= t && t < c.start + c.duration);
    if (speaker) clip.props.avatar = speaker[1].id;
  }
  if (!track) {
    track = newTrack(CLIP_TYPES[clip.type].label);
    store.project.tracks[['background', 'video', 'image', 'audio'].includes(clip.type) ? 'push' : 'unshift'](track);
  }
  track.clips.push(clip);
  store.commit();
  store.select(clip.id);
}
function deleteSelected() {
  const found = store.findClip(store.selection);

  found.track.clips.splice(found.track.clips.indexOf(found.clip), 1);

}

  found.track.clips.push(copy);

  const found = store.findClip(store.selection), t = frameRound(store.time);

const MAGIC = 'VPRJ';
function downloadBlob(blob, name) {
  const a = h('a', { href: URL.createObjectURL(blob), download: name });

  setTimeout(() => URL.revokeObjectURL(a.href), 60_000);

      const w = await handle.createWritable();

async function saveProject(consolidate = false) {
  const all = store.project.assets;
  if (consolidate && all.some(a => a.linked && media.has(a.id))) {
    for (const a of all) if (media.has(a.id)) a.linked = false;
    store.commit();
  }
  const missing = all.filter(a => !media.has(a.id)).length;
  if (missing) toast(`${missing} missing file(s) saved as links only: relink them in the Media list to embed them`);
  const blobs = [], assets = [];
  let offset = 0;
  for (const a of all) {
    const m = !a.linked && media.get(a.id);
    if (!m) { assets.push({ ...a }); continue; }
    assets.push({ ...a, offset, size: m.blob.size });
    blobs.push(m.blob);
    offset += m.blob.size;
  }
  const sources = [...plugins.values()].filter(p => p.source).map(p => p.source);
  const json = new TextEncoder().encode(JSON.stringify({ version: 1, project: { ...store.project, assets }, plugins: sources }));
  const head = new DataView(new ArrayBuffer(12));
  [...MAGIC].forEach((ch, i) => head.setUint8(i, ch.charCodeAt(0)));
  head.setUint32(4, 1, true);
  head.setUint32(8, json.length, true);
  await saveFile(new Blob([head, json, ...blobs], { type: 'application/octet-stream' }), `${store.project.settings.name || 'project'}.vproj`);
}
async function openProject(file) {
  const head = new DataView(await file.slice(0, 12).arrayBuffer());
  if (String.fromCharCode(...[0, 1, 2, 3].map(i => head.getUint8(i))) !== MAGIC) throw new Error('Not an Overlay Studio project');
  const base = 12 + head.getUint32(8, true);
  const { project, plugins: sources = [] } = JSON.parse(await file.slice(12, base).text());
  for (const src of sources) await loadPluginSource(src).catch(e => toast(`Plugin failed to load: ${e.message}`));
  let missing = 0;
  for (const a of project.assets) {
    if (a.offset === undefined) { if (!await restoreLinked(a) && !media.has(a.id)) missing++; continue; }
    await addMedia(a, file.slice(base + a.offset, base + a.offset + a.size, a.mime));
    delete a.offset;
  }
  pause();
  store.load(project);
  if (missing) toast(`${missing} linked file(s) need relinking: click them in the Media list`);
}

/* ---------- export ---------- */

async function mixAudio(duration) {
  const clips = [...store.clips()].filter(([tr, c]) => !tr.hidden && ['video', 'audio'].includes(c.type) && media.has(c.props.asset));
  if (!clips.length) return null;
  const ctx = new OfflineAudioContext(2, Math.ceil(duration * 48000), 48000);
  let any = false;
  for (const [, c] of clips) {
    const buf = await decodeAudio(c.props.asset), len = Math.min(c.duration, duration - c.start);
    if (!buf || len <= 0) continue;
    const n = Math.max(2, Math.ceil(len * 100)), curve = Float32Array.from({ length: n }, (_, i) => clamp(audioGain(c, i * len / (n - 1))));
    if (!curve.some(Boolean)) continue;
    const src = ctx.createBufferSource(), gain = ctx.createGain();
    src.buffer = buf;
    gain.gain.setValueCurveAtTime(curve, c.start, len);
    src.connect(gain).connect(ctx.destination);
    src.start(c.start, c.in, len);
    any = true;
  }
  return any ? ctx.startRendering() : null;
}
async function openVideoFeeds(MB, fps, frames) {
  const feeds = [];
  for (const [track, clip] of store.clips()) {
    const layer = engine.layers.get(clip.id), m = media.get(clip.props.asset);
    if (track.hidden || clip.type !== 'video' || !layer || !m) continue;
    const input = new MB.Input({ formats: MB.ALL_FORMATS, source: new MB.BlobSource(m.blob) });
    const vt = await input.getPrimaryVideoTrack();
    if (!vt) continue;
    const inside = t => t >= clip.start && t < clip.start + clip.duration, times = [];
    for (let f = 0; f < frames; f++) if (inside(f / fps)) times.push(clip.in + f / fps - clip.start);
    const it = new MB.CanvasSink(vt, { poolSize: 2 }).canvasesAtTimestamps(times);
    feeds.push({
      pull: async t => { if (inside(t)) layer.exportFrame = (await it.next()).value?.canvas ?? null; },
      close: () => { it.return(); input.dispose?.(); layer.exportFrame = null; },
    });
  }
  return feeds;
}
async function exportVideo({ format, quality, audio }, onProgress, signal) {
  const MB = await import('mediabunny');
  const { width: W, height: H, fps, duration } = store.project.settings, q = MB[quality];
  const fmt = format === 'webm' ? new MB.WebMOutputFormat() : new MB.Mp4OutputFormat({ fastStart: 'in-memory' });
  const vcodec = await MB.getFirstEncodableVideoCodec(fmt.getSupportedVideoCodecs(), { width: W, height: H, bitrate: q });
  if (!vcodec) throw new Error(`This browser cannot encode ${format.toUpperCase()} video at ${W}×${H}`);
  await Promise.all([...store.clips()].filter(([, c]) => c.type === 'bubble').map(([, c]) => document.fonts.load(`${c.props.weight} 40px "${c.props.font}"`)));
  const output = new MB.Output({ format: fmt, target: new MB.BufferTarget() });
  const video = new MB.CanvasSource(engine.renderer.domElement, { codec: vcodec, bitrate: q });
  output.addVideoTrack(video, { frameRate: fps });
  const mix = audio ? await mixAudio(duration) : null;
  let sound = null;
  if (mix) {
    const acodec = await MB.getFirstEncodableAudioCodec(fmt.getSupportedAudioCodecs(), { numberOfChannels: 2, sampleRate: 48000, bitrate: q });
    if (acodec) output.addAudioTrack(sound = new MB.AudioBufferSource({ codec: acodec, bitrate: q }));
  }
  await output.start();
  const soundDone = sound?.add(mix);
  const frames = Math.round(duration * fps);
  pause();
  engine.exporting = true;
  const feeds = await openVideoFeeds(MB, fps, frames);
  try {
    for (let f = 0; f < frames; f++) {
      if (signal.aborted) throw new DOMException('Export cancelled', 'AbortError');
      const t = f / fps;
      for (const feed of feeds) await feed.pull(t);
      engine.render(t);
      await video.add(t, 1 / fps);
      onProgress((f + 1) / frames, f + 1, frames);
    }
    await soundDone;
    await output.finalize();
  } catch (e) {
    await output.cancel().catch(() => {});
    throw e;
  } finally {
    for (const feed of feeds) feed.close();
    engine.exporting = false;
    engine.requestRender();
  }
  return new Blob([output.target.buffer], { type: fmt.mimeType });
}

      case 'bool': { const el = h('input', { type: 'checkbox', onchange: () => set(el.checked, true) }); return [el]; }
      case 'select': { const el = h('select', { onchange: () => set(el.value, true) }); return [el]; }

    }

    if (sig === el.dataset.sig) return;

function propBinding(id, name, def) {

  const finish = final => final ? store.commit() : store.touch();
  return {
    get: () => clip() && (evalProp(clip(), name, lt()) ?? def.default),
    set: (v, final) => { setValue(clip(), name, v, lt()); finish(final); },
    key: animatable(def) ? {
      state: () => keyAt(clip(), name, lt()) ? 'on' : clip().keys[name]?.length ? 'has' : 'none',
      toggle: () => { toggleKey(clip(), name, lt()); store.commit(); },
      ease: () => keyAt(clip(), name, lt())?.ease,

    get: () => root() && parent()[keys.at(-1)],
    set: (v, final) => { parent()[keys.at(-1)] = conv(v); final ? store.commit() : store.touch(); },
  };

    const m = media.get(id), remove = () => removeAsset(id);
    if (!m) return this.item({ name, meta: 'Missing: click to relink', ic: kind, remove, cls: 'missing', onclick: () => relink(liveAsset(id)) });
    const meta = [kind !== 'audio' && `${width}×${height}`, kind !== 'image' && duration && `${duration.toFixed(1)}s`].filter(Boolean).join(' · ');
    const badge = h('button', {
      class: 'badge', title: linked ? 'Linked to a file on disk: click to embed it in the project' : 'Embedded in the project: click to link to the file on disk',
      onclick: e => { e.stopPropagation(); toggleLinked(liveAsset(id)); },
    }, linked ? 'Linked' : 'Embedded');
    return this.item({ payload: { kind: 'asset', id }, name, meta, thumb: m.thumb, ic: kind, remove, badge });
  }
  item({ payload, name, meta, thumb, ic, remove, badge, cls = '', onclick }) {
    const drag = payload ? {
      draggable: true, title: `${name}: drag onto the timeline, or double-click to add at the playhead`,
      ondragstart: e => { e.dataTransfer.setData(DND, JSON.stringify(payload)); e.dataTransfer.effectAllowed = 'copy'; },
      ondblclick: () => addClip(payload),
    } : { title: name };
    return h('div', { class: `item ${cls}`, ...drag, ...onclick && { onclick } },
      h('div', { class: 'thumb', style: thumb ? `background-image:url("${thumb}")` : '' }, thumb ? null : icon(ic)),
      h('div', { class: 'name' }, name), h('div', { class: 'meta' }, meta), badge,
      remove && h('button', { class: 'icon-btn rm', title: 'Remove from project', onclick: e => { e.stopPropagation(); remove(); } }, icon('x')));
  }
}

class ExportDialog extends Component {
  opts = { format: 'mp4', quality: 'QUALITY_HIGH', audio: true };
  connectedCallback() {
    this.dialog = this.$('dialog');
    const bind = key => ({ get: () => this.opts[key], set: v => { this.opts[key] = v; } });
    this.$('.fields').replaceChildren(
      h('vt-field').bind(choice('Format', 'mp4', [['mp4', 'MP4 (H.264 or HEVC, AAC)'], ['webm', 'WebM (VP9 or AV1, Opus)']]), bind('format')),
      h('vt-field').bind(choice('Quality', 'QUALITY_HIGH', [['QUALITY_MEDIUM', 'Medium'], ['QUALITY_HIGH', 'High'], ['QUALITY_VERY_HIGH', 'Very high']]), bind('quality')),
      h('vt-field').bind(flag('Include audio', true), bind('audio')));
    this.$('.go').onclick = () => this.run();
    this.$('.close').onclick = () => this.ac ? this.ac.abort() : this.dialog.close();
  }
  open() {
    const { width, height, fps, duration } = store.project.settings;
    this.$('.summary').textContent = `${width}×${height} at ${fps} fps, ${duration}s (${Math.round(duration * fps)} frames)`;
    this.$('progress').value = 0;
    this.$('.status').textContent = '';
    this.$('.dl').hidden = true;
    this.dialog.showModal();
  }
  async run() {
    const go = this.$('.go'), status = this.$('.status'), close = this.$('.close'), t0 = performance.now();
    this.ac = new AbortController();
    go.disabled = true;
    close.textContent = 'Cancel';
    try {
      const blob = await exportVideo(this.opts, (p, f, n) => {
        this.$('progress').value = p;
        status.textContent = `Rendering frame ${f} of ${n}`;
      }, this.ac.signal);
      const name = `${store.project.settings.name || 'export'}.${this.opts.format}`;
      status.textContent = `Done: ${(blob.size / 1e6).toFixed(1)} MB in ${((performance.now() - t0) / 1000).toFixed(1)}s`;
      downloadBlob(blob, name);
      Object.assign(this.$('.dl'), { hidden: false, href: URL.createObjectURL(blob), download: name });
    } catch (e) {
      status.textContent = e.name === 'AbortError' ? 'Export cancelled' : `Export failed: ${e.message}`;
      console.error(e);
    } finally {
      this.ac = null;
      go.disabled = false;
      close.textContent = 'Close';
    }
  }
}

/* ---------- boot ---------- */

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  if (!el.matches(':popover-open')) el.showPopover();
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => el.hidePopover(), 4500);
}
addEventListener('unhandledrejection', e => toast(e.reason?.message ?? String(e.reason)));

[ghostPlugin, snowPlugin, starsPlugin, cloudsPlugin].forEach(p => registerPlugin(p));
const engine = new Engine();
store.load(demoProject());
Object.assign(window, { overlayStudio: { THREE, store, engine, registerPlugin, exportVideo, saveProject, openProject, importFiles } });

customElements.define('vt-field', Field);
customElements.define('vt-props', Props);
customElements.define('vt-timeline', Timeline);
customElements.define('vt-viewport', Viewport);
customElements.define('vt-assets', Assets);
customElements.define('vt-export', ExportDialog);

const root = document.documentElement, darkQuery = matchMedia('(prefers-color-scheme: dark)');
const themeIcon = () => setIcon(document.querySelector('[data-act="theme"] svg'),
  (root.dataset.theme ?? (darkQuery.matches ? 'dark' : 'light')) === 'dark' ? 'sun' : 'moon');
try { const saved = localStorage.getItem('theme'); if (saved) root.dataset.theme = saved; } catch {}
darkQuery.addEventListener('change', themeIcon);
themeIcon();

const openInput = document.getElementById('open-file');
openInput.onchange = () => {
  const file = openInput.files[0];
  openInput.value = '';
  if (file) openProject(file).catch(e => toast(`Could not open project: ${e.message}`));
};
const ACTIONS = {
  new: () => { pause(); store.project = emptyProject(); store.select(null); store.commit(); store.seek(0); },
  open: () => openInput.click(),
  save: () => saveProject().catch(e => toast(`Could not save: ${e.message}`)),
  consolidate: () => saveProject(true).catch(e => toast(`Could not save: ${e.message}`)),
  undo: () => store.undo(),
  redo: () => store.redo(),
  split: splitSelected,
  export: () => document.querySelector('vt-export').open(),
  theme: () => {
    const next = (root.dataset.theme ?? (darkQuery.matches ? 'dark' : 'light')) === 'dark' ? 'light' : 'dark';
    root.dataset.theme = next;
    try { localStorage.setItem('theme', next); } catch {}
    themeIcon();
  },
};
const saveMenu = document.getElementById('save-menu');
document.addEventListener('click', e => {
  const act = e.target.closest?.('.toolbar [data-act], #save-menu [data-act]')?.dataset.act;
  if (!act) return;
  if (saveMenu.matches(':popover-open')) saveMenu.hidePopover();
  ACTIONS[act]?.();
});

const addMenu = document.getElementById('add-menu');
function buildAddMenu() {
  const item = (ic, label, payload) => h('button', { onclick: () => { addMenu.hidePopover(); addClip(payload); } }, icon(ic), label);
  const byKind = kind => [...plugins.values()].filter(p => p.kind === kind).map(p => item(CLIP_TYPES[kind].icon, p.name, { kind: 'plugin', id: p.id }));
  addMenu.replaceChildren(
    item('bubble', 'Speech bubble', { kind: 'bubble' }),
    h('h4', {}, 'Avatars'), ...byKind('avatar'),
    h('h4', {}, 'Avatar actions'), ...avatarActions().map(({ plugin, action, label }) => item('bolt', `${label} (${plugin.name})`, { kind: 'action', plugin: plugin.id, action })),
    h('h4', {}, 'Backgrounds'), ...byKind('background'),
    h('hr'),
    h('button', { onclick: () => { addMenu.hidePopover(); document.querySelector('vt-assets').importDialog(); } }, icon('import'), 'Import media…'));
}
store.addEventListener('plugins', buildAddMenu);
buildAddMenu();

const isTyping = e => {
  const el = e.composedPath()[0];
  return el instanceof HTMLElement && (el.matches('input:not([type=range]):not([type=checkbox]), textarea, select') || el.isContentEditable);
};
document.addEventListener('keydown', e => {
  if (isTyping(e) || document.querySelector('vt-export').dialog?.open) return;
  const mod = e.ctrlKey || e.metaKey, k = e.key.toLowerCase(), fps = store.project.settings.fps;
  const run = fn => { e.preventDefault(); fn(); };
  if (mod && k === 'z') return run(e.shiftKey ? ACTIONS.redo : ACTIONS.undo);
  if (mod && k === 'y') return run(ACTIONS.redo);
  if (mod && k === 'd') return run(duplicateSelected);
  if (mod && k === 's') return run(e.shiftKey ? ACTIONS.consolidate : ACTIONS.save);
  if (mod && k === 'o') return run(ACTIONS.open);
  if (mod && k === 'e') return run(ACTIONS.export);
  if (mod) return;
  const keys = {
    ' ': togglePlay, 's': splitSelected, 'delete': deleteSelected, 'backspace': deleteSelected,
    'arrowleft': () => step(e.shiftKey ? -1 : -1 / fps), 'arrowright': () => step(e.shiftKey ? 1 : 1 / fps),
    'home': () => { pause(); store.seek(0); }, 'end': () => { pause(); store.seek(store.project.settings.duration); },
    'escape': () => store.select(null),
  };
  if (keys[k]) run(keys[k]);
});

document.addEventListener('dragover', e => { if (e.dataTransfer.types.includes('Files')) e.preventDefault(); });
document.addEventListener('drop', e => {
  if (!e.dataTransfer.files.length) return;
  e.preventDefault();
  const project = [...e.dataTransfer.files].find(f => f.name.endsWith('.vproj'));
  if (project) openProject(project).catch(err => toast(`Could not open project: ${err.message}`));
  else dropEntries(e.dataTransfer).then(importFiles);
});

const splitter = document.querySelector('.splitter'), main = document.querySelector('main');
splitter.addEventListener('pointerdown', e => {
  splitter.setPointerCapture(e.pointerId);
  const y0 = e.clientY, h0 = document.querySelector('vt-timeline').getBoundingClientRect().height;
  const drag = ev => main.style.setProperty('--tl-h', `${clamp(h0 - (ev.clientY - y0), 140, innerHeight - 260)}px`);
  splitter.addEventListener('pointermove', drag);
  splitter.addEventListener('pointerup', () => splitter.removeEventListener('pointermove', drag), { once: true });
});
</script>
